/* ==========================================================================
   模块 12：月历打卡视图（Bug 16 修复跨月对齐 + 自定义时间范围统计）
   ========================================================================== */
let calCursorYear = new Date().getFullYear();
let calCursorMonth = new Date().getMonth(); // 0-11
let calSelectedDate = getLocalDateStr();
let calViewMode = 'month';

function setCalendarView(mode) {
  calViewMode = mode;
  ['month', '3day', 'day'].forEach(m => {
    document.getElementById(`cal-view-${m}`).classList.toggle('active', m === mode);
  });
  renderCalendarPage();
}

function shiftCalendarMonth(delta) {
  const dt = new Date(calCursorYear, calCursorMonth + delta, 1);
  calCursorYear = dt.getFullYear();
  calCursorMonth = dt.getMonth();
  renderCalendarPage();
}

function buildCalendarCellHTML(dateStr, dayNum) {
  const today = getLocalDateStr();
  const dayTodos = state.todos.filter(t => isTodoVisibleOnDate(t, dateStr));
  const doneCnt = dayTodos.filter(t => t.done).length;
  const pct = dayTodos.length > 0 ? Math.round((doneCnt / dayTodos.length) * 100) : 0;

  const dayDiaries = state.diaries.filter(d => d.date === dateStr);
  const words = dayDiaries.reduce((s, d) => s + (d.content ? d.content.length : 0), 0);
  const goalHit = words >= (state.profile.writingGoal || 200);
  const moodLabel = dayDiaries.length > 0 ? dayDiaries[0].emotion : '';

  const r = 10;
  const circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;

  return `
    <div class="cal-cell ${dateStr === today ? 'today' : ''} ${dateStr === calSelectedDate ? 'selected' : ''}" onclick="selectCalendarDate('${dateStr}')">
      ${goalHit ? '<span class="cal-goal-dot" title="已达成每日写作目标"></span>' : ''}
      <svg width="26" height="26" viewBox="0 0 26 26">
        <circle cx="13" cy="13" r="${r}" fill="none" stroke="var(--border-color)" stroke-width="2.2"/>
        <circle cx="13" cy="13" r="${r}" fill="none" stroke="var(--accent)" stroke-width="2.2"
          stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
          transform="rotate(-90 13 13)"/>
        <text x="13" y="16" text-anchor="middle" font-size="9.5" fill="var(--text-primary)">${dayNum}</text>
      </svg>
      <span class="cal-mood-tag">${escapeHTML(moodLabel)}</span>
    </div>
  `;
}

function renderCalendarPage() {
  document.getElementById('cal-month-label').textContent = `${calCursorYear}年${String(calCursorMonth + 1).padStart(2, '0')}月`;
  const area = document.getElementById('calendar-render-area');

  if (calViewMode === 'month') {
    const firstWeekday = new Date(calCursorYear, calCursorMonth, 1).getDay();
    const totalDays = new Date(calCursorYear, calCursorMonth + 1, 0).getDate();
    const weekHeaders = ['日', '一', '二', '三', '四', '五', '六'].map(w => `<div class="cal-weekday">${w}</div>`).join('');
    let cells = '';
    for (let i = 0; i < firstWeekday; i++) {
      cells += `<div class="cal-cell empty"></div>`;
    }
    for (let d = 1; d <= totalDays; d++) {
      const ds = `${calCursorYear}-${String(calCursorMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      cells += buildCalendarCellHTML(ds, d);
    }
    area.innerHTML = `<div class="cal-grid">${weekHeaders}${cells}</div>`;
  } else if (calViewMode === '3day') {
    const dates = [
      addDaysToLocalDate(calSelectedDate, -1),
      calSelectedDate,
      addDaysToLocalDate(calSelectedDate, 1)
    ];
    area.innerHTML = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
      ${dates.map(ds => buildCalendarCellHTML(ds, ds.slice(5))).join('')}
    </div>`;
  } else {
    area.innerHTML = `<div style="max-width:160px;margin:0 auto;">${buildCalendarCellHTML(calSelectedDate, calSelectedDate)}</div>`;
  }

  const dTodos = state.todos.filter(t => isTodoVisibleOnDate(t, calSelectedDate));
  const dDiaries = state.diaries.filter(d => d.date === calSelectedDate);
  const dFocus = state.focusLogs.filter(f => f.date === calSelectedDate).reduce((s, f) => s + f.minutes, 0);

  document.getElementById('cal-selected-detail').innerHTML = `
    <div class="section-header" style="margin-bottom:6px;">
      <strong>${calSelectedDate} 当日档案</strong>
      <span class="badge">专注 ${dFocus} 分钟</span>
    </div>
    <div class="text-xs mb-8">待办完成：${dTodos.filter(t => t.done).length} / ${dTodos.length} 项 · 日记记录：${dDiaries.length} 篇</div>
    ${dTodos.map(t => `<div class="text-xs" style="padding:3px 0;">[${t.done ? '已完成' : '未完成'}] ${escapeHTML(t.title)}</div>`).join('')}
  `;

  document.getElementById('cal-stat-start').value = state.ui.calStatStart;
  document.getElementById('cal-stat-end').value = state.ui.calStatEnd;
  renderCalendarStats();
}

function selectCalendarDate(dateStr) {
  calSelectedDate = dateStr;
  renderCalendarPage();
}

function setStatRangePreset(target, days) {
  const end = getLocalDateStr();
  const start = addDaysToLocalDate(end, -(days - 1));
  if (target === 'cal') {
    state.ui.calStatStart = start;
    state.ui.calStatEnd = end;
    document.getElementById('cal-stat-start').value = start;
    document.getElementById('cal-stat-end').value = end;
    renderCalendarStats();
  } else {
    state.ui.ledgerStatStart = start;
    state.ui.ledgerStatEnd = end;
    document.getElementById('ledger-stat-start').value = start;
    document.getElementById('ledger-stat-end').value = end;
    renderLedgerSection();
  }
  saveState();
}

function renderCalendarStats() {
  const s = document.getElementById('cal-stat-start').value;
  const e = document.getElementById('cal-stat-end').value;
  state.ui.calStatStart = s;
  state.ui.calStatEnd = e;
  saveState();

  const todosInRange = state.todos.filter(t => t.date >= s && t.date <= e);
  const doneInRange = todosInRange.filter(t => t.done).length;
  const diariesInRange = state.diaries.filter(d => d.date >= s && d.date <= e);
  const wordsInRange = diariesInRange.reduce((acc, d) => acc + (d.content ? d.content.length : 0), 0);
  const focusMin = state.focusLogs.filter(f => f.date >= s && f.date <= e).reduce((acc, f) => acc + f.minutes, 0);

  document.getElementById('cal-range-stats-output').innerHTML = `
    <div class="kpi-strip" style="margin-bottom:0;">
      <div class="kpi-tile"><div class="kpi-val">${doneInRange}/${todosInRange.length}</div><div class="kpi-lbl">区间待办完成</div></div>
      <div class="kpi-tile"><div class="kpi-val">${diariesInRange.length} 篇</div><div class="kpi-lbl">区间日记数</div></div>
      <div class="kpi-tile"><div class="kpi-val">${wordsInRange} 字</div><div class="kpi-lbl">区间累计写作</div></div>
      <div class="kpi-tile"><div class="kpi-val">${focusMin} 分</div><div class="kpi-lbl">区间番茄专注</div></div>
    </div>
  `;
}

/* ==========================================================================
   模块 13：心情日记（时光胶囊时区安全 + 单篇日记读写权限锁）
   ========================================================================== */
let diaryDraftMedia = '';
let diaryDraftAttachment = null;
let unlockedDiaryIds = new Set();

function simpleHashPwd(pwd) {
  let h = 2166136261;
  for (let i = 0; i < pwd.length; i++) {
    h ^= pwd.charCodeAt(i);
    h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
  }
  return 'H_' + (h >>> 0).toString(16);
}

function updateDiaryWordCount() {
  const txt = document.getElementById('diary-content-input').value;
  document.getElementById('diary-word-counter').textContent = `实时字数：${txt.length} 字`;
}

function saveDiaryEntry() {
  const content = document.getElementById('diary-content-input').value.trim();
  if (!content) { showToast('请输入日记正文内容'); return; }
  const today = getLocalDateStr();
  const title = document.getElementById('diary-title-input').value.trim() || `${today} 心情随笔`;
  const weather = document.getElementById('diary-weather-select').value;
  const capsuleDate = document.getElementById('diary-capsule-date').value;
  const rawPwd = document.getElementById('diary-lock-pwd').value.trim();
  const tagId = document.getElementById('diary-tag-select').value;

  const doneToday = state.todos.filter(t => t.date === today && t.done).map(t => t.title);

  state.diaries.unshift({
    id: 'dia_' + Date.now(),
    title,
    content,
    emotion: detectEmotionFromText(content),
    weather,
    date: today,
    createdAt: Date.now(),
    capsuleDate,
    lockHash: rawPwd ? simpleHashPwd(rawPwd) : '',
    tagId,
    linkedCompletedTodos: doneToday,
    media: diaryDraftMedia,
    attachment: diaryDraftAttachment
  });

  document.getElementById('diary-title-input').value = '';
  document.getElementById('diary-content-input').value = '';
  document.getElementById('diary-capsule-date').value = '';
  document.getElementById('diary-lock-pwd').value = '';
  document.getElementById('diary-draft-media').innerHTML = '';
  diaryDraftMedia = '';
  diaryDraftAttachment = null;

  saveState();
  renderDiaryPage();
  showToast('心情日记已保存');
}

function promptUnlockDiary(diaryId) {
  openModal(`
    <div class="section-header"><span class="section-title">验证日记访问密码</span><button type="button" class="btn btn-sm" onclick="closeModal()">取消</button></div>
    <p class="text-xs mb-8">该日记已启用独立读写权限锁，请输入密码解锁查看：</p>
    <input type="password" class="input-control mb-8" id="verify-diary-pwd-input" placeholder="输入日记访问密码" />
    <button type="button" class="btn btn-primary" onclick="verifyDiaryPassword('${diaryId}')">确认解锁</button>
  `);
}

function verifyDiaryPassword(diaryId) {
  const diary = state.diaries.find(d => d.id === diaryId);
  const val = document.getElementById('verify-diary-pwd-input').value.trim();
  if (!diary || simpleHashPwd(val) !== diary.lockHash) {
    showToast('密码校验未通过');
    return;
  }
  unlockedDiaryIds.add(diaryId);
  closeModal();
  renderDiaryPage();
  showToast('日记已解锁');
}

function toggleDiaryLockSetting(diaryId) {
  const diary = state.diaries.find(d => d.id === diaryId);
  if (!diary) return;
  if (diary.lockHash) {
    diary.lockHash = '';
    unlockedDiaryIds.delete(diaryId);
    saveState();
    renderDiaryPage();
    showToast('已解除该日记密码锁');
  } else {
    openModal(`
      <div class="section-header"><span class="section-title">为日记设置密码锁</span><button type="button" class="btn btn-sm" onclick="closeModal()">取消</button></div>
      <input type="password" class="input-control mb-8" id="set-diary-new-pwd" placeholder="设置访问密码" />
      <button type="button" class="btn btn-primary" onclick="applyNewDiaryLock('${diaryId}')">启用加密锁</button>
    `);
  }
}

function applyNewDiaryLock(diaryId) {
  const diary = state.diaries.find(d => d.id === diaryId);
  const pwd = document.getElementById('set-diary-new-pwd').value.trim();
  if (!diary || !pwd) return;
  diary.lockHash = simpleHashPwd(pwd);
  unlockedDiaryIds.delete(diaryId);
  saveState();
  closeModal();
  renderDiaryPage();
  showToast('已设置独立阅读密码锁');
}

function deleteDiaryToTrash(id) {
  const idx = state.diaries.findIndex(d => d.id === id);
  if (idx === -1) return;
  const [rem] = state.diaries.splice(idx, 1);
  state.trash.unshift({
    id: 'tr_' + Date.now(),
    type: 'diary',
    label: rem.title,
    payload: rem,
    deletedAt: Date.now()
  });
  saveState();
  renderDiaryPage();
  showToast('日记已移入回收站');
}

function renderDiaryPage() {
  const today = getLocalDateStr();
  const todayWords = state.diaries.filter(d => d.date === today).reduce((s, d) => s + d.content.length, 0);
  const goal = state.profile.writingGoal || 200;
  document.getElementById('diary-goal-badge').textContent = `今日 ${todayWords} / ${goal} 字 ${todayWords >= goal ? '(已达标)' : ''}`;

  document.getElementById('diary-tag-select').innerHTML = `<option value="">无标签</option>` +
    state.tags.map(tg => `<option value="${tg.id}">${escapeHTML(tg.name)}</option>`).join('');
  updateDiaryWordCount();

  const container = document.getElementById('diary-list-container');
  if (state.diaries.length === 0) {
    container.innerHTML = `<div class="empty-placeholder">暂无日记记录，写下第一篇生活手记吧</div>`;
    return;
  }

  container.innerHTML = state.diaries.map(d => {
    const isCapsuleLocked = d.capsuleDate && today < d.capsuleDate;
    const isPwdLocked = d.lockHash && !unlockedDiaryIds.has(d.id);
    const tag = state.tags.find(tg => tg.id === d.tagId);

    if (isCapsuleLocked) {
      return `
        <div class="glass-card" id="diary-card-${d.id}">
          <div class="section-header" style="margin-bottom:4px;">
            <strong>${escapeHTML(d.title)}</strong>
            <span class="badge">时光胶囊封存中</span>
          </div>
          <div class="text-xs">将于本地时间 ${escapeHTML(d.capsuleDate)} 自动解锁开启</div>
        </div>
      `;
    }

    if (isPwdLocked) {
      return `
        <div class="glass-card" id="diary-card-${d.id}">
          <div class="section-header" style="margin-bottom:4px;">
            <strong>${escapeHTML(d.title)}</strong>
            <div class="flex-row">
              <span class="badge">已加密锁定</span>
              <button type="button" class="btn btn-primary btn-sm" onclick="promptUnlockDiary('${d.id}')">输入密码查看</button>
            </div>
          </div>
          <div class="text-xs">日期：${escapeHTML(d.date)} · 内容已受独立密码保护</div>
        </div>
      `;
    }

    return `
      <div class="glass-card" id="diary-card-${d.id}">
        <div class="section-header" style="margin-bottom:6px;">
          <div>
            <strong>${escapeHTML(d.title)}</strong>
            <div class="flex-row mt-8" style="gap:5px;">
              <span class="badge">${escapeHTML(d.date)}</span>
              <span class="badge">心情: ${escapeHTML(d.emotion)}</span>
              <span class="badge">天气: ${escapeHTML(d.weather)}</span>
              ${tag ? `<span class="badge" style="color:${tag.color};">${escapeHTML(tag.name)}</span>` : ''}
            </div>
          </div>
          <div class="flex-row">
            <button type="button" class="btn btn-sm" onclick="toggleDiaryLockSetting('${d.id}')">${d.lockHash ? '解除密码锁' : '加密码锁'}</button>
            <button type="button" class="btn btn-sm" data-cat="${escapeHTML(d.title)}" data-body="${escapeHTML(d.content.slice(0, 140))}" data-meta="${escapeHTML(d.date + ' · ' + d.emotion)}" onclick="openShareCardFromBtn(this)">分享卡</button>
            <button type="button" class="btn btn-danger btn-sm" onclick="deleteDiaryToTrash('${d.id}')">删除</button>
          </div>
        </div>
        <p style="white-space:pre-wrap;margin-top:8px;">${escapeHTML(d.content)}</p>
        ${d.media ? `<img src="${d.media}" style="max-width:100%;max-height:220px;border-radius:10px;margin-top:8px;" />` : ''}
        ${d.attachment ? `<div class="mt-8"><span class="chip" onclick="previewAttachment('${d.id}', 'diary')">附件: ${escapeHTML(d.attachment.name)}</span></div>` : ''}
        ${d.linkedCompletedTodos && d.linkedCompletedTodos.length > 0 ? `
          <div class="text-xs mt-8" style="padding-top:6px;border-top:1px dashed var(--border-color);">
            自动关联当日已完成待办：${d.linkedCompletedTodos.map(escapeHTML).join('、')}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

/* ==========================================================================
   模块 14：朋友圈 / iCity 动态与本地评论回复
   ========================================================================== */
let postDraftMedia = '';
let postDraftAttachment = null;

function updatePostWordCount() {
  const len = document.getElementById('post-content-input').value.length;
  document.getElementById('post-word-counter').textContent = `${len} 字`;
}

function publishMomentPost() {
  const content = document.getElementById('post-content-input').value.trim();
  if (!content && !postDraftMedia) { showToast('请输入动态文字或添加图片/涂鸦'); return; }
  state.posts.unshift({
    id: 'pst_' + Date.now(),
    content,
    visibility: document.getElementById('post-visibility-select').value,
    tagId: document.getElementById('post-tag-select').value,
    media: postDraftMedia,
    attachment: postDraftAttachment,
    liked: false,
    likeCount: 0,
    starred: false,
    comments: [],
    date: getLocalDateStr(),
    time: getLocalTimeStr(),
    createdAt: Date.now()
  });

  document.getElementById('post-content-input').value = '';
  document.getElementById('post-draft-media').innerHTML = '';
  postDraftMedia = '';
  postDraftAttachment = null;
  saveState();
  renderMomentsPage();
  showToast('动态已发布');
}

function togglePostLike(id) {
  const p = state.posts.find(x => x.id === id);
  if (!p) return;
  p.liked = !p.liked;
  p.likeCount = Math.max(0, (p.likeCount || 0) + (p.liked ? 1 : -1));
  saveState();
  renderMomentsPage();
}

function togglePostStar(id) {
  const p = state.posts.find(x => x.id === id);
  if (!p) return;
  p.starred = !p.starred;
  saveState();
  renderMomentsPage();
}

function submitPostComment(id) {
  const inp = document.getElementById(`cmt-input-${id}`);
  const txt = inp ? inp.value.trim() : '';
  if (!txt) return;
  const p = state.posts.find(x => x.id === id);
  if (!p) return;
  if (!Array.isArray(p.comments)) p.comments = [];
  p.comments.push({ author: state.profile.nickname, text: txt, time: getLocalTimeStr() });
  saveState();
  renderMomentsPage();
}

function deletePostToTrash(id) {
  const idx = state.posts.findIndex(p => p.id === id);
  if (idx === -1) return;
  const [rem] = state.posts.splice(idx, 1);
  state.trash.unshift({
    id: 'tr_' + Date.now(),
    type: 'post',
    label: rem.content.slice(0, 20) || '图片动态',
    payload: rem,
    deletedAt: Date.now()
  });
  saveState();
  renderMomentsPage();
  showToast('动态已移入回收站');
}

function renderMomentsPage() {
  document.getElementById('post-tag-select').innerHTML = `<option value="">无标签</option>` +
    state.tags.map(tg => `<option value="${tg.id}">${escapeHTML(tg.name)}</option>`).join('');
  updatePostWordCount();

  document.getElementById('post-tag-filter-bar').innerHTML = `
    <button type="button" class="chip ${state.ui.postFilterTagId === '' ? 'active' : ''}" onclick="setPostTagFilter('')">全部动态</button>
    ${state.tags.map(tg => `<button type="button" class="chip ${state.ui.postFilterTagId === tg.id ? 'active' : ''}" onclick="setPostTagFilter('${tg.id}')">${escapeHTML(tg.name)}</button>`).join('')}
  `;

  let list = state.posts;
  if (state.ui.postFilterTagId) list = list.filter(p => p.tagId === state.ui.postFilterTagId);

  const feed = document.getElementById('moments-feed-list');
  if (list.length === 0) {
    feed.innerHTML = `<div class="empty-placeholder">暂无动态记录，发一条朋友圈或 iCity 碎片吧</div>`;
    return;
  }

  feed.innerHTML = list.map(p => {
    const tag = state.tags.find(tg => tg.id === p.tagId);
    return `
      <div class="glass-card">
        <div class="section-header" style="margin-bottom:6px;">
          <div class="flex-row">
            <strong>${escapeHTML(state.profile.nickname)}</strong>
            <span class="text-xs">${p.date} ${p.time || ''}</span>
            <span class="badge">${p.visibility === 'private' ? '仅自己可见' : '全部可见'}</span>
            ${tag ? `<span class="badge" style="color:${tag.color};">${escapeHTML(tag.name)}</span>` : ''}
          </div>
          <button type="button" class="btn btn-danger btn-sm" onclick="deletePostToTrash('${p.id}')">删除</button>
        </div>
        <p style="white-space:pre-wrap;">${escapeHTML(p.content)}</p>
        ${p.media ? `<img src="${p.media}" style="max-width:100%;max-height:240px;border-radius:10px;margin-top:8px;" />` : ''}
        ${p.attachment ? `<div class="mt-8"><span class="chip" onclick="previewAttachment('${p.id}', 'post')">附件: ${escapeHTML(p.attachment.name)}</span></div>` : ''}
        <div class="flex-row mt-8" style="border-top:1px solid var(--border-color);padding-top:8px;">
          <button type="button" class="btn btn-sm ${p.liked ? 'active' : ''}" onclick="togglePostLike('${p.id}')">赞 (${p.likeCount || 0})</button>
          <button type="button" class="btn btn-sm ${p.starred ? 'active' : ''}" onclick="togglePostStar('${p.id}')">${p.starred ? '已收藏' : '收藏'}</button>
        </div>
        <div class="mt-8">
          ${(p.comments || []).map(c => `<div class="text-xs" style="padding:3px 0;"><strong>${escapeHTML(c.author)}</strong>：${escapeHTML(c.text)} <span style="opacity:0.6;">(${c.time})</span></div>`).join('')}
          <div class="flex-row mt-8">
            <input type="text" class="input-control" id="cmt-input-${p.id}" placeholder="写下本地评论..." style="padding:5px 9px;font-size:12px;" />
            <button type="button" class="btn btn-sm" onclick="submitPostComment('${p.id}')">发送</button>
          </div>
        </div>
      </div>

function setPostTagFilter(tagId) {
  state.ui.postFilterTagId = tagId;
  saveState();
  renderMomentsPage();
}

/* ==========================================================================
   模块 15：第 6 页 (index=5) 全站时间轴总览视图
   ========================================================================== */
let timelineFilterType = 'all';

function setTimelineFilter(type, btnEl) {
  timelineFilterType = type;
  document.querySelectorAll('#page-5 .chip').forEach(c => c.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
  renderTimelinePage();
}

function renderTimelinePage() {
  const events = [];

  state.todos.forEach(t => {
    events.push({
      type: 'todo',
      typeLabel: t.done ? '待办已完成' : '待办计划',
      date: t.date,
      ts: t.createdAt || 0,
      title: t.title,
      detail: `${t.time ? t.time + ' · ' : ''}优先级: ${t.priority}`
    });
  });

  state.diaries.forEach(d => {
    events.push({
      type: 'diary',
      typeLabel: '心情日记',
      date: d.date,
      ts: d.createdAt || 0,
      title: d.title,
      detail: d.lockHash ? '[已加密锁定]' : `${d.emotion} · ${d.content.slice(0, 70)}`
    });
  });

  state.posts.forEach(p => {
    events.push({
      type: 'post',
      typeLabel: '朋友圈动态',
      date: p.date,
      ts: p.createdAt || 0,
      title: p.content.slice(0, 50) || '图片动态',
      detail: `点赞 ${p.likeCount || 0} · 评论 ${(p.comments || []).length}`
    });
  });

  state.transactions.forEach(tx => {
    const ledger = state.ledgers.find(l => l.id === tx.ledgerId);
    events.push({
      type: 'expense',
      typeLabel: tx.type === 'income' ? '账本收入' : '账本支出',
      date: tx.date,
      ts: tx.createdAt || 0,
      title: `${tx.title} (${tx.type === 'income' ? '+' : '-'}${tx.amount}元)`,
      detail: `${ledger ? ledger.name : '默认账本'} · ${tx.category}`
    });
  });

  state.parcels.forEach(p => {
    events.push({
      type: 'parcel',
      typeLabel: p.picked ? '快递已取' : '快递待取',
      date: p.date || getLocalDateStr(new Date(p.createdAt || Date.now())),
      ts: p.createdAt || 0,
      title: `取件码 ${p.code}`,
      detail: `${p.station} · ${p.deadline}`
    });
  });

  const filtered = timelineFilterType === 'all' ? events : events.filter(e => e.type === timelineFilterType);
  filtered.sort((a, b) => {
    if (a.date !== b.date) return b.date.localeCompare(a.date);
    return b.ts - a.ts;
  });

  const stream = document.getElementById('global-timeline-list');
  if (filtered.length === 0) {
    stream.innerHTML = `<div class="empty-placeholder">时间轴暂无对应记录</div>`;
    return;
  }

  stream.innerHTML = filtered.map(ev => `
    <div class="timeline-node">
      <div class="flex-row" style="justify-content:space-between;">
        <span class="badge">${ev.typeLabel}</span>
        <span class="text-xs">${ev.date}</span>
      </div>
      <div style="font-weight:600;margin-top:4px;">${escapeHTML(ev.title)}</div>
      <div class="text-xs mt-8">${escapeHTML(ev.detail)}</div>
    </div>
  `).join('');
}

/* ==========================================================================
   模块 16：多账本隔离统计（Bug 9 修复跨月数据错误与账本ID严格绑定）
   ========================================================================== */
function switchLedger(id) {
  state.activeLedgerId = id;
  saveState();
  renderLedgerSection();
}

function createNewLedger() {
  openModal(`
    <div class="section-header"><span class="section-title">新建独立账本</span><button type="button" class="btn btn-sm" onclick="closeModal()">取消</button></div>
    <input type="text" class="input-control mb-8" id="new-ledger-name" placeholder="账本名称（如：装修账本、宠物账本）" />
    <input type="number" class="input-control mb-8" id="new-ledger-budget" placeholder="周期预算金额（可选）" />
    <button type="button" class="btn btn-primary" onclick="confirmCreateLedger()">创建账本</button>
  `);
}

function confirmCreateLedger() {
  const name = document.getElementById('new-ledger-name').value.trim();
  const budget = parseFloat(document.getElementById('new-ledger-budget').value) || 0;
  if (!name) return;
  const id = 'ledger_' + Date.now();
  state.ledgers.push({ id, name, budget });
  state.activeLedgerId = id;
  saveState();
  closeModal();
  renderLedgerSection();
}

function updateLedgerBudget(val) {
  const cur = state.ledgers.find(l => l.id === state.activeLedgerId);
  if (cur) {
    cur.budget = parseFloat(val) || 0;
    saveState();
    renderLedgerSection();
  }
}

function addLedgerTransaction() {
  const title = document.getElementById('tx-title-input').value.trim();
  const amount = parseFloat(document.getElementById('tx-amount-input').value);
  const type = document.getElementById('tx-type-select').value;
  const category = document.getElementById('tx-cat-select').value;
  if (!title || isNaN(amount) || amount <= 0) {
    showToast('请输入有效说明与正数金额');
    return;
  }
  state.transactions.unshift({
    id: 'tx_' + Date.now(),
    ledgerId: state.activeLedgerId,
    type,
    amount,
    title,
    category,
    date: getLocalDateStr(),
    createdAt: Date.now()
  });
  document.getElementById('tx-title-input').value = '';
  document.getElementById('tx-amount-input').value = '';
  saveState();
  renderLedgerSection();
  showToast('已记入当前账本');
}

function renderLedgerSection() {
  const sel = document.getElementById('active-ledger-select');
  sel.innerHTML = state.ledgers.map(l => `<option value="${l.id}" ${l.id === state.activeLedgerId ? 'selected' : ''}>${escapeHTML(l.name)}</option>`).join('');
  const curLedger = state.ledgers.find(l => l.id === state.activeLedgerId) || state.ledgers[0];
  document.getElementById('ledger-budget-input').value = curLedger.budget || '';

  const sDate = document.getElementById('ledger-stat-start').value || state.ui.ledgerStatStart;
  const eDate = document.getElementById('ledger-stat-end').value || state.ui.ledgerStatEnd;
  document.getElementById('ledger-stat-start').value = sDate;
  document.getElementById('ledger-stat-end').value = eDate;
  state.ui.ledgerStatStart = sDate;
  state.ui.ledgerStatEnd = eDate;

  // Bug 9 修复：严格绑定当前账本 ID + 起止日期时间戳范围比较
  const txs = state.transactions.filter(t => {
    if (t.ledgerId !== curLedger.id) return false;
    if (sDate && t.date < sDate) return false;
    if (eDate && t.date > eDate) return false;
    return true;
  });

  const totalExp = txs.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);
  const totalInc = txs.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0);

  const catMap = {};
  txs.filter(t => t.type === 'expense').forEach(t => {
    catMap[t.category] = (catMap[t.category] || 0) + Number(t.amount || 0);
  });
  const colors = ['#7D9484', '#7A95A8', '#A6927E', '#B88B92', '#C99A5B', '#8E9B97'];
  const entries = Object.entries(catMap);
  const r = 34;
  const circ = 2 * Math.PI * r;
  let accPct = 0;

  const arcs = entries.map(([cat, val], idx) => {
    const pct = totalExp > 0 ? val / totalExp : 0;
    const dash = pct * circ;
    const rot = accPct * 360 - 90;
    accPct += pct;
    return `<circle cx="48" cy="48" r="${r}" fill="none" stroke="${colors[idx % colors.length]}" stroke-width="12"
      stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" transform="rotate(${rot.toFixed(1)} 48 48)"/>`;
  }).join('');

  const overBudget = curLedger.budget > 0 && totalExp > curLedger.budget;

  document.getElementById('ledger-donut-summary').innerHTML = `
    <svg width="96" height="96" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--border-color)" stroke-width="12"/>
      ${arcs}
    </svg>
    <div style="flex:1;padding-left:12px;">
      <div class="text-xs">区间总支出：<strong style="color:${overBudget ? 'var(--danger)' : 'var(--text-primary)'};">${totalExp.toFixed(2)} 元</strong> ${overBudget ? '(已超预算!)' : ''}</div>
      <div class="text-xs">区间总收入：<strong>${totalInc.toFixed(2)} 元</strong></div>
      <div class="text-xs">账本预算上限：${curLedger.budget > 0 ? curLedger.budget + ' 元' : '未设定'}</div>
      <div class="flex-row mt-8" style="gap:4px;">
        ${entries.map(([c, v], i) => `<span class="badge" style="color:${colors[i % colors.length]};">${escapeHTML(c)} ${v.toFixed(0)}</span>`).join('')}
      </div>
    </div>
  `;

  document.getElementById('ledger-tx-list').innerHTML = txs.length === 0
    ? `<div class="text-xs" style="text-align:center;padding:8px;">该时间段暂无账目流水</div>`
    : txs.slice(0, 12).map(t => `
      <div class="flex-row" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border-color);font-size:12px;">
        <span>[${t.date}] ${escapeHTML(t.title)} (${escapeHTML(t.category)})</span>
        <strong style="color:${t.type === 'income' ? 'var(--success)' : 'var(--text-primary)'};">${t.type === 'income' ? '+' : '-'}${Number(t.amount).toFixed(2)}</strong>
      </div>
    `).join('');
}

/* ==========================================================================
   模块 17：进度存档快照与 7天回收站（Bug 11 修复时区过期自动清理）
   ========================================================================== */
function createManualSnapshot() {
  if (state.snapshots.length >= 8) {
    showToast('最多保存 8 份快照，请先删除旧快照后再创建');
    return;
  }
  openModal(`
    <div class="section-header"><span class="section-title">创建进度存档快照</span><button type="button" class="btn btn-sm" onclick="closeModal()">取消</button></div>
    <input type="text" class="input-control mb-8" id="snapshot-name-input" value="存档_${getLocalDateStr()}_${getLocalTimeStr()}" placeholder="输入快照备注名称" />
    <button type="button" class="btn btn-primary" onclick="confirmCreateSnapshot()">保存快照</button>
  `);
}

function confirmCreateSnapshot() {
  const name = document.getElementById('snapshot-name-input').value.trim() || `快照_${Date.now()}`;
  const clone = JSON.parse(JSON.stringify(state));
  delete clone.snapshots;
  state.snapshots.unshift({
    id: 'snap_' + Date.now(),
    name,
    createdAt: `${getLocalDateStr()} ${getLocalTimeStr()}`,
    data: clone
  });
  saveState();
  closeModal();
  renderSnapshotsList();
  showToast('已创建数据快照');
}

function restoreFromSnapshot(snapId) {
  const snap = state.snapshots.find(s => s.id === snapId);
  if (!snap) return;
  const keepSnaps = state.snapshots;
  state = migrateAndSanitizeState(JSON.parse(JSON.stringify(snap.data)));
  state.snapshots = keepSnaps;
  saveState();
  applyVisualSettings();
  renderAllCurrent();
  showToast(`已回退恢复至快照：${snap.name}`);
}

function deleteSnapshot(snapId) {
  state.snapshots = state.snapshots.filter(s => s.id !== snapId);
  saveState();
  renderSnapshotsList();
}

function renderSnapshotsList() {
  const el = document.getElementById('snapshots-list');
  if (state.snapshots.length === 0) {
    el.innerHTML = `<div class="text-xs">暂无进度存档快照（最多支持保存 8 份）</div>`;
    return;
  }
  el.innerHTML = state.snapshots.map(s => `
    <div class="flex-row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);">
      <div>
        <strong>${escapeHTML(s.name)}</strong>
        <div class="text-xs">创建时间：${escapeHTML(s.createdAt)}</div>
      </div>
      <div class="flex-row">
        <button type="button" class="btn btn-primary btn-sm" onclick="restoreFromSnapshot('${s.id}')">回退恢复</button>
        <button type="button" class="btn btn-danger btn-sm" onclick="deleteSnapshot('${s.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

function purgeExpiredTrash() {
  const now = Date.now();
  const before = state.trash.length;
  state.trash = state.trash.filter(item => (now - Number(item.deletedAt || 0)) < SEVEN_DAYS_MS);
  if (state.trash.length !== before) saveState();
}

function restoreTrashItem(trashId) {
  const idx = state.trash.findIndex(t => t.id === trashId);
  if (idx === -1) return;
  const [item] = state.trash.splice(idx, 1);
  if (item.type === 'todo') state.todos.unshift(item.payload);
  if (item.type === 'diary') state.diaries.unshift(item.payload);
  if (item.type === 'post') state.posts.unshift(item.payload);
  if (item.type === 'parcel') state.parcels.unshift(item.payload);
  saveState();
  renderTrashList();
  showToast('已从回收站恢复条目');
}

function emptyTrashAll() {
  state.trash = [];
  saveState();
  renderTrashList();
  showToast('回收站已永久清空');
}

function renderTrashList() {
  purgeExpiredTrash();
  const el = document.getElementById('trash-list');
  if (state.trash.length === 0) {
    el.innerHTML = `<div class="text-xs">回收站为空（删除条目自动保留 7 天）</div>`;
    return;
  }
  el.innerHTML = state.trash.map(t => {
    const remainDays = Math.max(1, Math.ceil((SEVEN_DAYS_MS - (Date.now() - t.deletedAt)) / 86400000));
    return `
      <div class="flex-row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);font-size:12px;">
        <span>[${t.type}] ${escapeHTML(t.label)} · 剩余 ${remainDays} 天</span>
        <button type="button" class="btn btn-sm" onclick="restoreTrashItem('${t.id}')">一键恢复</button>
      </div>
    `;
  }).join('');
}

/* ==========================================================================
   模块 18：图片批注画布（Bug 14 修复）、涂鸦板、花体字（Bug 15）与语音识别（Bug 12）
   ========================================================================== */
function triggerImageUpload(target) {
  const inp = document.getElementById('hidden-image-input');
  inp.value = '';
  inp.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > MAX_FILE_BYTES) {
      showToast('图片大小超过 800KB 限制，请压缩后再上传');
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => showToast('图片加载失败');
    reader.onload = () => openAnnotationModal(reader.result, target);
    reader.readAsDataURL(file);
  };
  inp.click();
}

document.addEventListener('paste', (e) => {
  const items = (e.clipboardData || e.originalEvent.clipboardData)?.items || [];
  for (const item of items) {
    if (item.type.indexOf('image') !== -1) {
      const blob = item.getAsFile();
      if (!blob) return;
      if (blob.size > MAX_FILE_BYTES) {
        showToast('粘贴截图超过 800KB 限制');
        return;
      }
      const reader = new FileReader();
      reader.onerror = () => showToast('截图读取失败');
      reader.onload = () => {
        const target = currentPageIdx === 4 ? 'post' : 'diary';
        openAnnotationModal(reader.result, target);
      };
      reader.readAsDataURL(blob);
      break;
    }
  }
});

// Bug 14 修复：批注画布自适应移动端视口并精确映射触摸/鼠标坐标比例
function openAnnotationModal(dataUrl, target) {
  openModal(`
    <div class="section-header">
      <span class="section-title">图片圈画批注</span>
      <button type="button" class="btn btn-sm" onclick="closeModal()">取消</button>
    </div>
    <div class="canvas-responsive-wrap mb-8">
      <canvas id="anno-canvas"></canvas>
    </div>
    <div class="flex-row" style="justify-content:space-between;">
      <div class="flex-row">
        <span class="text-xs">画笔颜色：</span>
        <input type="color" id="anno-color" value="#C86D6D" />
      </div>
      <button type="button" class="btn btn-primary" onclick="confirmAnnotationImage('${target}')">完成批注并插入</button>
    </div>
  `);

  const canvas = document.getElementById('anno-canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    const maxW = Math.min(window.innerWidth - 68, 450);
    const maxH = Math.min(window.innerHeight * 0.52, 420);
    const scale = Math.min(1, maxW / img.width, maxH / img.height);
    canvas.width = Math.max(120, Math.round(img.width * scale));
    canvas.height = Math.max(120, Math.round(img.height * scale));
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    let drawing = false;
    const getPos = (ev) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    };

    const start = (ev) => {
      ev.preventDefault();
      drawing = true;
      const p = getPos(ev);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    };
    const move = (ev) => {
      if (!drawing) return;
      ev.preventDefault();
      const p = getPos(ev);
      ctx.strokeStyle = document.getElementById('anno-color').value;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    };
    const end = () => { drawing = false; };

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  };
  img.src = dataUrl;
}

// Bug 15 修复：花体字转换仅映射 ASCII 英文字母与数字，中文及标点原样保留
function convertToFancyText(text, style = 'script') {
  return Array.from(text).map(ch => {
    const code = ch.charCodeAt(0);
    if (style === 'script') {
      if (code >= 65 && code <= 90) return String.fromCodePoint(0x1D4D0 + (code - 65));
      if (code >= 97 && code <= 122) return String.fromCodePoint(0x1D4EA + (code - 97));
    } else {
      if (code >= 65 && code <= 90) return String.fromCodePoint(0x1D538 + (code - 65));
      if (code >= 97 && code <= 122) return String.fromCodePoint(0x1D552 + (code - 97));
      if (code >= 48 && code <= 57) return String.fromCodePoint(0x1D7D8 + (code - 48));
    }
    return ch;
  }).join('');
}

// Bug 12 修复：Web Speech API 单例销毁管理
let recognitionInstance = null;

function destroySpeechInstance() {
  if (recognitionInstance) {
    try { recognitionInstance.onresult = null; recognitionInstance.onerror = null; recognitionInstance.onend = null; } catch (e) {}
    try { recognitionInstance.abort(); } catch (e) {}
    recognitionInstance = null;
  }
}

function startVoiceInput(targetInputId) {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) {
    showToast('当前浏览器不支持内置语音识别');
    return;
  }
  destroySpeechInstance();
  const rec = new SpeechRec();
  rec.lang = 'zh-CN';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  recognitionInstance = rec;

  showToast('正在聆听语音，请说话...');
  rec.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    const el = document.getElementById(targetInputId);
    if (el) el.value = (el.value ? el.value + ' ' : '') + transcript;
    showToast('语音识别完成');
  };
  rec.onerror = () => { destroySpeechInstance(); showToast('语音识别未捕获或权限受限'); };
  rec.onend = () => { destroySpeechInstance(); };
  rec.start();
}

/* ==========================================================================
   模块 19：Canvas 莫兰迪分享卡片（Bug 8 修复特殊字符与换行渲染）、年度回顾与番茄钟
   ========================================================================== */
function sanitizeCanvasText(str) {
  return String(str || '').replace(/[\r\t]/g, ' ').replace(/\\n/g, '\n');
}

function wrapCanvasLines(ctx, text, maxWidth) {
  const clean = sanitizeCanvasText(text);
  const paragraphs = clean.split('\n');
  const lines = [];
  paragraphs.forEach(p => {
    let line = '';
    for (const ch of Array.from(p)) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line.length > 0) {
        lines.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
  });
  return lines;
}

function requestBrowserNotification() {
  if (!('Notification' in window)) {
    showToast('当前环境不支持浏览器系统通知');
    return;
  }
  Notification.requestPermission().then(res => {

  });

function pollDueReminders() {
  const now = new Date();
  const today = getLocalDateStr(now);
  const yesterday = addDaysToLocalDate(today, -1);

  let cleaned = false;
  Object.keys(state.notifiedIds).forEach(key => {
    const parts = key.split('_');
    const keyDate = parts[parts.length - 2];
    if (keyDate && /^\d{4}-\d{2}-\d{2}$/.test(keyDate) && keyDate < yesterday) {
      delete state.notifiedIds[key];
      cleaned = true;
    }
  });
  if (cleaned) saveState();

  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  state.todos.forEach(t => {
    if (t.done || !t.time || !isTodoVisibleOnDate(t, today)) return;
    const [hh, mm] = t.time.split(':').map(Number);
    const offset = Number(t.remindOffsetMin || 0);
    const targetMinutes = hh * 60 + mm - offset;
    const notifyKey = `${t.id}_${today}_${offset}`;

    if (nowMinutes >= targetMinutes && nowMinutes <= targetMinutes + 2 && !state.notifiedIds[notifyKey]) {
      state.notifiedIds[notifyKey] = true;
      saveState();
      const body = offset > 0 ? `距离 ${t.time} 还有 ${offset} 分钟` : `预定时间 ${t.time} 已到`;
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(`TimeMind 日程提醒：${t.title}`, { body });
      }
      showToast(`日程提醒：${t.title} (${body})`);
    }
  });
}

  inp.onchange = (e) => {
    const file = e.target.files[0];
    if (!file || file.size > MAX_FILE_BYTES) { showToast('头像文件需小于 800KB'); return; }
    const reader = new FileReader();
    reader.onerror = () => showToast('头像读取失败');
    reader.onload = () => {
      state.profile.avatarType = 'img';
      state.profile.avatarData = reader.result;
      saveState();
      applyVisualSettings();
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function triggerWallpaperUpload() {
  const inp = document.getElementById('hidden-image-input');
  inp.value = '';
  inp.onchange = (e) => {
    const file = e.target.files[0];
    if (!file || file.size > MAX_FILE_BYTES) { showToast('壁纸文件需小于 800KB'); return; }
    const reader = new FileReader();
    reader.onerror = () => showToast('壁纸读取失败');
    reader.onload = () => {
      state.profile.wallpaper = reader.result;
      saveState();
      applyVisualSettings();
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function clearWallpaper() {
  state.profile.wallpaper = '';
  saveState();
  applyVisualSettings();
}

function toggleQuickMute() {
  state.audio.master = !state.audio.master;
  if (!state.audio.master) SoundEngine.stopBgm();
  else if (state.audio.bgm !== 'none') SoundEngine.startBgm(state.audio.bgm);
  saveState();
  document.getElementById('btn-sound-quick').classList.toggle('active', state.audio.master);
  showToast(state.audio.master ? '全局音效已开启' : '全局音效已静音');
}

function syncAudioSettings() {
  state.audio.master = document.getElementById('snd-master').checked;
  state.audio.typing = document.getElementById('snd-type').checked;
  state.audio.flip = document.getElementById('snd-flip').checked;
  if (!state.audio.master) SoundEngine.stopBgm();
  else if (state.audio.bgm !== 'none') SoundEngine.startBgm(state.audio.bgm);
  saveState();
}

function setBgmTrack(track) {
  state.audio.bgm = track;
  saveState();
  SoundEngine.startBgm(track);
  renderSettingsPage();
}

function exportBackupJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `TimeMind_Backup_${getLocalDateStr()}.json`;
  a.click();
}

function triggerBackupImport() {
  const inp = document.getElementById('hidden-json-input');
  inp.value = '';
  inp.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onerror = () => showToast('读取备份文件失败');
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        state = migrateAndSanitizeState(parsed);
        saveState();
        applyVisualSettings();
        renderAllCurrent();
        showToast('备份已成功导入并兼容补全');
      } catch (err) {
        showToast('JSON 备份文件格式无效');
      }
    };
    reader.readAsText(file);
  };
  inp.click();
}

function renderSettingsPage() {
  renderLedgerSection();
  document.getElementById('setting-nickname').value = state.profile.nickname;
  document.getElementById('setting-writing-goal').value = state.profile.writingGoal || 200;
  document.getElementById('setting-blur-range').value = state.profile.blurPx ?? 20;
  document.getElementById('blur-val-label').textContent = `${state.profile.blurPx ?? 20}px`;

  document.getElementById('snd-master').checked = state.audio.master;
  document.getElementById('snd-type').checked = state.audio.typing;
  document.getElementById('snd-flip').checked = state.audio.flip;
  ['none', 'rain', 'cafe', 'wind'].forEach(t => {
    document.getElementById(`bgm-${t}`).classList.toggle('active', state.audio.bgm === t);
  });

  document.getElementById('custom-tags-list').innerHTML = state.tags.map(tg =>
    `<span class="badge" style="border-color:${tg.color};color:${tg.color};">${escapeHTML(tg.name)}</span>`
  ).join('');

  document.getElementById('quick-phrases-list').innerHTML = state.phrases.map((ph, idx) =>
    `<span class="chip">${escapeHTML(ph)} <span onclick="state.phrases.splice(${idx},1);saveState();renderSettingsPage();">×</span></span>`
  ).join('');

  renderSnapshotsList();
  renderTrashList();
}

/* ==========================================================================
   模块 22：通用弹窗控制器（Bug 17 修复遮罩点击关闭与防叠加残留）与启动初始化
   ========================================================================== */
(function initModalEvents() {
  const backdrop = document.getElementById('global-modal');
  const box = document.getElementById('global-modal-body');
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) closeModal();
  });
  box.addEventListener('click', (e) => {
    e.stopPropagation();
  });
})();

function openModal(html) {
  const body = document.getElementById('global-modal-body');
  body.innerHTML = '';
  body.innerHTML = html;
  document.getElementById('global-modal').classList.add('open');
}

function closeModal() {
  const backdrop = document.getElementById('global-modal');
  const body = document.getElementById('global-modal-body');
  backdrop.classList.remove('open');
  body.innerHTML = '';
}

function openQuickFabModal() {
  openModal(`
    <div class="section-header"><span class="section-title">快捷新建面板</span><button type="button" class="btn btn-sm" onclick="closeModal()">关闭</button></div>
    <div class="grid-2">
      <button type="button" class="btn btn-primary" onclick="closeModal();openTodoModal()">新建待办事项</button>
      <button type="button" class="btn" onclick="closeModal();openBulkScheduleModal()">导入日程文本</button>
      <button type="button" class="btn" onclick="closeModal();goToPage(1)">录入快递取件</button>
      <button type="button" class="btn" onclick="closeModal();goToPage(3)">写心情日记</button>
      <button type="button" class="btn" onclick="closeModal();goToPage(4)">发布朋友圈动态</button>
      <button type="button" class="btn" onclick="closeModal();goToPage(6)">快速记一笔账</button>
    </div>
  `);
}

function renderAllCurrent() {
  renderDashboard();
  renderParcelPage();
  renderCalendarPage();
  renderDiaryPage();
  renderMomentsPage();
  renderTimelinePage();
  renderSettingsPage();
}

(function bootstrap() {
  purgeExpiredTrash();
  applyVisualSettings();
  document.getElementById('btn-sound-quick').classList.toggle('active', state.audio.master);
  syncBottomNavActive(0);
  renderAllCurrent();
  pollDueReminders();
})();
</script>
</body>
</html>
