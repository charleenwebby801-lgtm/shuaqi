<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>TimeMind - 个人生活与效率手账</title>
<style>
/* ==========================================================================
   1. CSS 变量与多套 INS 莫兰迪主题及暗黑模式定义（Bug 10 修复）
   ========================================================================== */
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --radius-xl: 22px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --shadow-soft: 0 10px 30px rgba(30, 35, 32, 0.06);
  --shadow-card: 0 4px 16px rgba(30, 35, 32, 0.04);
  --blur-val: 20px;

  /* 默认主题：鼠尾草绿 (Sage) */
  --accent: #7D9484;
  --accent-soft: rgba(125, 148, 132, 0.14);
  --accent-text: #4F6656;
  --bg-base: #F3F5F2;
  --bg-gradient: linear-gradient(135deg, #EEF2EC 0%, #F7F6F2 55%, #E7ECE8 100%);
  --surface: rgba(255, 255, 255, 0.74);
  --surface-strong: rgba(255, 255, 255, 0.92);
  --surface-subtle: rgba(244, 246, 243, 0.78);
  --text-primary: #252A27;
  --text-secondary: #68726B;
  --text-muted: #98A29B;
  --border-color: rgba(125, 148, 132, 0.18);
  --border-highlight: rgba(255, 255, 255, 0.85);
  --danger: #C86D6D;
  --danger-soft: rgba(200, 109, 109, 0.14);
  --warning: #C99A5B;
  --success: #6D9B7B;
  --overlay-mask: rgba(245, 247, 244, 0.55);
  --scrollbar-thumb: rgba(125, 148, 132, 0.35);
  color-scheme: light;
}

/* 主题2：海盐奶蓝 */
[data-theme="seasalt"] {
  --accent: #7A95A8;
  --accent-soft: rgba(122, 149, 168, 0.15);
  --accent-text: #4A667A;
  --bg-base: #F1F5F8;
  --bg-gradient: linear-gradient(135deg, #E8EFF4 0%, #F7F8FA 55%, #E3ECF2 100%);
  --border-color: rgba(122, 149, 168, 0.2);
}

/* 主题3：燕麦拿铁 */
[data-theme="oat"] {
  --accent: #A6927E;
  --accent-soft: rgba(166, 146, 126, 0.15);
  --accent-text: #73604D;
  --bg-base: #F6F3EE;
  --bg-gradient: linear-gradient(135deg, #F2ECE3 0%, #FAF8F5 55%, #EBE3D7 100%);
  --border-color: rgba(166, 146, 126, 0.2);
}

/* 主题4：樱花灰粉 */
[data-theme="sakura"] {
  --accent: #B88B92;
  --accent-soft: rgba(184, 139, 146, 0.15);
  --accent-text: #855860;
  --bg-base: #F7F2F3;
  --bg-gradient: linear-gradient(135deg, #F4E9EB 0%, #FAF7F8 55%, #EFE2E4 100%);
  --border-color: rgba(184, 139, 146, 0.2);
}

/* 暗黑模式全量覆盖（修复暗黑下输入框、滚动条、SVG 继承异常） */
[data-mode="dark"] {
  --bg-base: #151817;
  --bg-gradient: linear-gradient(135deg, #151817 0%, #1C201E 55%, #141716 100%);
  --surface: rgba(32, 37, 35, 0.78);
  --surface-strong: rgba(38, 44, 41, 0.95);
  --surface-subtle: rgba(45, 52, 49, 0.78);
  --text-primary: #EAECEB;
  --text-secondary: #A3ACA6;
  --text-muted: #6E7872;
  --border-color: rgba(255, 255, 255, 0.10);
  --border-highlight: rgba(255, 255, 255, 0.09);
  --shadow-soft: 0 12px 32px rgba(0, 0, 0, 0.38);
  --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.28);
  --overlay-mask: rgba(18, 21, 20, 0.68);
  --scrollbar-thumb: rgba(255, 255, 255, 0.22);
  color-scheme: dark;
}
[data-mode="dark"][data-theme="sage"] { --accent: #8FA896; --accent-text: #B4CCB9; }
[data-mode="dark"][data-theme="seasalt"] { --accent: #8EAAC0; --accent-text: #B5CEE0; }
[data-mode="dark"][data-theme="oat"] { --accent: #BCA894; --accent-text: #DAC7B4; }
[data-mode="dark"][data-theme="sakura"] { --accent: #CCA0A7; --accent-text: #E6BFC5; }

/* ==========================================================================
   2. 全局基础重置、滚动条与背景壁纸磨砂层
   ========================================================================== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 99px; }
::-webkit-scrollbar-track { background: transparent; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: var(--font-sans);
  background: var(--bg-base);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.55;
  transition: background-color 0.3s ease, color 0.3s ease;
}

#bg-wallpaper-layer {
  position: fixed;
  inset: -24px;
  z-index: 0;
  background: var(--bg-gradient);
  background-size: cover;
  background-position: center;
  pointer-events: none;
}

#bg-blur-mask {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: var(--overlay-mask);
  backdrop-filter: blur(var(--blur-val));
  -webkit-backdrop-filter: blur(var(--blur-val));
  pointer-events: none;
}

/* ==========================================================================
   3. 顶部状态栏与 7 页立体翻书容器（层级管理：主壳 z-index: 5）
   ========================================================================== */
#app-shell {
  position: relative;
  z-index: 5;
  width: 100%;
  height: 100dvh;
  height: 100vh;
  max-width: 920px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top)) 16px 8px;
  gap: 10px;
  flex-shrink: 0;
  z-index: 10;
}

.user-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border-highlight);
  padding: 5px 12px 5px 6px;
  border-radius: 999px;
  box-shadow: var(--shadow-card);
  cursor: pointer;
}

.user-avatar-box {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent-soft);
  flex-shrink: 0;
}

.user-avatar-box img, .user-avatar-box svg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

.user-meta {
  display: flex;
  flex-direction: column;
}

.user-name {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.2;
}

.page-indicator-text {
  font-size: 11px;
  color: var(--text-secondary);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border-color);
  background: var(--surface);
  color: var(--text-primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease, background-color 0.2s ease;
}
.icon-btn svg { pointer-events: none; }
.icon-btn:hover { background: var(--surface-strong); }
.icon-btn:active { transform: scale(0.93); }
.icon-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* 3D 翻书视口 */
#book-viewport {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  perspective: 1800px;
  padding: 4px 14px 8px;
  z-index: 6;
}

.book-page {
  position: absolute;
  inset: 4px 14px 8px;
  background: var(--surface);
  border: 1px solid var(--border-highlight);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-soft);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px 96px;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform-origin: left center;
  transform: rotateY(-10deg) translateX(22px) scale(0.98);
  transition: opacity 0.34s cubic-bezier(0.22, 1, 0.36, 1),
              transform 0.40s cubic-bezier(0.22, 1, 0.36, 1),
              visibility 0s linear 0.36s;
}

.book-page.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: rotateY(0deg) translateX(0) scale(1);
  z-index: 8;
  transition: opacity 0.34s cubic-bezier(0.22, 1, 0.36, 1),
              transform 0.40s cubic-bezier(0.22, 1, 0.36, 1),
              visibility 0s linear 0s;
}

.book-page.flip-out-left {
  opacity: 0;
  visibility: visible;
  transform: rotateY(-20deg) translateX(-36px) scale(0.96);
  z-index: 7;
}

.book-page.flip-out-right {
  opacity: 0;
  visibility: visible;
  transform: rotateY(16deg) translateX(36px) scale(0.96);
  z-index: 7;
}

/* 桌面端边缘翻页提示按钮（避免覆盖底部导航区域） */
.edge-turn-btn {
  position: fixed;
  top: 46%;
  transform: translateY(-50%);
  z-index: 25;
  width: 32px;
  height: 52px;
  border-radius: 16px;
  border: 1px solid var(--border-color);
  background: var(--surface-strong);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-card);
  opacity: 0.72;
  transition: opacity 0.2s, transform 0.2s;
}
.edge-turn-btn svg { pointer-events: none; }
.edge-turn-btn:hover { opacity: 1; transform: translateY(-50%) scale(1.05); }
.edge-turn-btn.left { left: 6px; }
.edge-turn-btn.right { right: 6px; }
@media (max-width: 640px) {
  .edge-turn-btn { width: 22px; height: 40px; opacity: 0.42; }
}

/* ==========================================================================
   4. 【核心修复 Bug 1 & Bug 20】底部 7 栏导航与悬浮快捷按钮层级与热区保障
   ========================================================================== */
.bottom-nav {
  position: relative;
  z-index: 50;
  flex-shrink: 0;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  align-items: stretch;
  gap: 2px;
  min-height: 58px;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--surface-strong);
  border-top: 1px solid var(--border-color);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  touch-action: manipulation;
  user-select: none;
}

.nav-item {
  position: relative;
  z-index: 51;
  width: 100%;
  min-height: 46px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 5px 2px;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  line-height: 1.1;
  touch-action: manipulation;
  transition: background-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
}

/* 关键修复：子元素 SVG 与文字禁用独立指针拦截，确保整块 46px+ 按钮热区 100% 命中 */
.nav-item svg,
.nav-item span {
  pointer-events: none;
}

.nav-item svg {
  width: 19px;
  height: 19px;
  stroke-width: 1.85;
  flex-shrink: 0;
}

.nav-item:active {
  transform: scale(0.94);
}

.nav-item.active {
  color: var(--accent-text);
  background: var(--accent-soft);
  font-weight: 600;
}

.fab-quick {
  position: fixed;
  right: 18px;
  bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  z-index: 45;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #fff;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.2s ease;
}
.fab-quick svg { pointer-events: none; }
.fab-quick:active { transform: scale(0.92); }

/* ==========================================================================
   5. 通用玻璃卡片、表单控件、标签与按钮组件
   ========================================================================== */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.section-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.2px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.glass-card {
  background: var(--surface-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-bottom: 12px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 7px 13px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--surface-strong);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  touch-action: manipulation;
  transition: all 0.16s ease;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-danger {
  background: var(--danger-soft);
  color: var(--danger);
  border-color: transparent;
}
.btn-sm { padding: 5px 10px; font-size: 11px; border-radius: var(--radius-sm); min-height: 28px; }

.input-control, .select-control, .textarea-control {
  width: 100%;
  background: var(--surface-strong);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  border-radius: var(--radius-md);
  padding: 8px 11px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.input-control:focus, .select-control:focus, .textarea-control:focus {
  border-color: var(--accent);
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  background: var(--accent-soft);
  color: var(--accent-text);
  border: 1px solid transparent;
  cursor: pointer;
  touch-action: manipulation;
}
.chip.active {
  background: var(--accent);
  color: #fff;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 500;
  background: var(--surface-strong);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
}

.empty-placeholder {
  text-align: center;
  padding: 28px 16px;
  color: var(--text-muted);
  font-size: 12px;
  border: 1px dashed var(--border-color);
  border-radius: var(--radius-lg);
}

/* ==========================================================================
   6. 全局智能指令框与历史下拉（Bug 19 修复点击外部自动收起）
   ========================================================================== */
.omni-box-wrap {
  position: relative;
  margin-bottom: 14px;
  z-index: 20;
}

.omni-input-row {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-strong);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 6px 8px 6px 12px;
  box-shadow: var(--shadow-card);
}

.omni-input-row input {
  flex: 1;
  min-width: 0;
  border: none;
  background: transparent;
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
}

.history-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  z-index: 38;
  background: var(--surface-strong);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  max-height: 230px;
  overflow-y: auto;
  padding: 8px;
  display: none;
}
.history-dropdown.open { display: block; animation: fadeIn 0.16s ease; }
.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  cursor: pointer;
}
.history-item:hover { background: var(--accent-soft); }

/* ==========================================================================
   7. 待办列表、优先级、子任务、拖拽排序（Bug 18）与批量操作栏（Bug 20）
   ========================================================================== */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
@media (max-width: 520px) {
  .kpi-strip { grid-template-columns: repeat(2, 1fr); }
}
.kpi-tile {
  background: var(--surface-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 10px;
}
.kpi-val { font-size: 17px; font-weight: 700; color: var(--accent-text); }
.kpi-lbl { font-size: 11px; color: var(--text-secondary); }

.todo-card {
  background: var(--surface-strong);
  border: 1px solid var(--border-color);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-md);
  padding: 11px 12px;
  margin-bottom: 8px;
  transition: transform 0.22s ease, opacity 0.22s ease, box-shadow 0.22s ease;
}
.todo-card.prio-urgent { border-left-color: #C86D6D; background: linear-gradient(90deg, rgba(200,109,109,0.09), var(--surface-strong) 35%); }
.todo-card.prio-high { border-left-color: #C99A5B; }
.todo-card.prio-medium { border-left-color: var(--accent); }
.todo-card.prio-low { border-left-color: #9AA5A0; }
.todo-card.done { opacity: 0.62; }
.todo-card.done .todo-title { text-decoration: line-through; }
.todo-card.dragging { opacity: 0.48; transform: scale(1.015); box-shadow: var(--shadow-soft); }
.todo-card.drag-over { border-top: 2px dashed var(--accent); }

.todo-main-row {
  display: flex;
  align-items: flex-start;
  gap: 9px;
}

.check-circle {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.8px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 2px;
  transition: all 0.2s ease;
}
.check-circle svg { pointer-events: none; }
.check-circle.checked {
  background: var(--accent);
  color: #fff;
}

.subtask-list {
  margin-top: 8px;
  padding-left: 26px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.progress-track {
  height: 4px;
  background: var(--border-color);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 6px;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.25s ease;
}

/* 批量操作悬浮栏（z-index: 46 高于页面，不遮挡底部导航 z-index: 50） */
.batch-bar {
  position: fixed;
  left: 50%;
  bottom: calc(68px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(150%);
  z-index: 46;
  background: var(--surface-strong);
  border: 1px solid var(--accent);
  border-radius: 999px;
  padding: 7px 14px;
  box-shadow: var(--shadow-soft);
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 94vw;
  overflow-x: auto;
  pointer-events: none;
  transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
}
.batch-bar.visible {
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}

/* ==========================================================================
   8. 日历网格、环形进度与时间轴组件（Bug 16 修复）
   ========================================================================== */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.cal-weekday {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  padding-bottom: 4px;
}
.cal-cell {
  aspect-ratio: 1 / 1.08;
  border-radius: var(--radius-md);
  background: var(--surface-strong);
  border: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3px;
  cursor: pointer;
  position: relative;
  font-size: 12px;
}
.cal-cell svg { pointer-events: none; }
.cal-cell.empty { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
.cal-cell.today { border-color: var(--accent); font-weight: 700; }
.cal-cell.selected { background: var(--accent-soft); border-color: var(--accent); }
.cal-mood-tag { font-size: 9px; color: var(--accent-text); line-height: 1.1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-goal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--success); position: absolute; top: 4px; right: 4px; }

/* 时间轴视图 */
.timeline-stream {
  position: relative;
  padding-left: 20px;
  border-left: 2px solid var(--border-color);
  margin-left: 8px;
}
.timeline-node {
  position: relative;
  margin-bottom: 14px;
  background: var(--surface-strong);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 10px 12px;
}
.timeline-node::before {
  content: "";
  position: absolute;
  left: -26px;
  top: 14px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg-base);
}

/* ==========================================================================
   9. 模态弹窗系统（Bug 17 修复）与画布响应式容器（Bug 14 修复）
   ========================================================================== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(15, 18, 17, 0.48);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-backdrop.open { display: flex; animation: fadeIn 0.2s ease; }

.modal-box {
  width: 100%;
  max-width: 520px;
  max-height: 86vh;
  overflow-y: auto;
  background: var(--surface-strong);
  border: 1px solid var(--border-highlight);
  border-radius: var(--radius-xl);
  padding: 18px;
  box-shadow: var(--shadow-soft);
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.97); }
  to { opacity: 1; transform: scale(1); }
}

.canvas-responsive-wrap {
  width: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  background: var(--surface-subtle);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  padding: 6px;
}
canvas {
  max-width: 100%;
  height: auto;
  touch-action: none;
  border-radius: var(--radius-sm);
}

.highlight-mark {
  background: var(--accent);
  color: #fff;
  padding: 0 3px;
  border-radius: 3px;
}

.toast-banner {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(-160%);
  z-index: 100;
  background: var(--surface-strong);
  color: var(--text-primary);
  border: 1px solid var(--accent);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  box-shadow: var(--shadow-soft);
  pointer-events: none;
  transition: transform 0.26s ease;
}
.toast-banner.show { transform: translateX(-50%) translateY(0); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 500px) { .grid-2 { grid-template-columns: 1fr; } }
.flex-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mb-8 { margin-bottom: 8px; }
.text-xs { font-size: 11px; color: var(--text-secondary); }
</style>
</head>

<script>
/* ==========================================================================
   模块 1：核心常量、本地时区安全工具（Bug 6 & Bug 11 修复）与转义辅助
   ========================================================================== */
const STORAGE_KEY = 'TIMEMIND_CLEAN_STATE_V3';
const MAX_FILE_BYTES = 800 * 1024; // 单文件严格小于 800KB
const SEVEN_DAYS_MS = 7 * 24 * 3600 * 1000;

const PAGE_NAMES = [
  '今日仪表盘',
  '快递取件',
  '月历打卡',
  '心情日记',
  '朋友圈动态',
  '时间轴总览',
  '多账本与设置'
];

// 严格使用本地设备时区 YYYY-MM-DD，杜绝 toISOString() 跨日偏差
function getLocalDateStr(dateObj = new Date()) {
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
  const d = String(dateObj.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function getLocalTimeStr(dateObj = new Date()) {
  const hh = String(dateObj.getHours()).padStart(2, '0');
  const mm = String(dateObj.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

function addDaysToLocalDate(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d + days);
  return getLocalDateStr(dt);
}

function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function showToast(msg) {
  const el = document.getElementById('toast-banner');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ==========================================================================
   模块 2：空白初始状态铁律与随机纯几何头像/无预设昵称生成器
   ========================================================================== */
function generateRandomNickname() {
  const adj = ['清风', '云间', '晨雾', '松间', '竹影', '微光', '静水', '山岚', '星野', '林深'];
  const noun = ['漫步者', '记录者', '拾光客', '观察员', '手账家', '旅人', '听风者', '书签'];
  const code = Math.floor(100 + Math.random() * 900);
  return `${adj[Math.floor(Math.random() * adj.length)]}${noun[Math.floor(Math.random() * noun.length)]}_${code}`;
}

function generateRandomAvatarSVG() {
  const palettes = [
    ['#7D9484', '#B8C9BE', '#E5ECE7'],
    ['#7A95A8', '#B3C6D4', '#E3ECF2'],
    ['#A6927E', '#CFC0B0', '#EFE9E1'],
    ['#B88B92', '#D9B8BD', '#F4E8EA']
  ];
  const p = palettes[Math.floor(Math.random() * palettes.length)];
  const cx = 24 + Math.floor(Math.random() * 16);
  const cy = 22 + Math.floor(Math.random() * 16);
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <rect width="64" height="64" fill="${p[2]}"/>
    <circle cx="${cx}" cy="${cy}" r="18" fill="${p[1]}"/>
    <path d="M10 56 C18 38, 46 38, 54 56 Z" fill="${p[0]}"/>
  </svg>`;
}

function createBlankInitialState() {
  const today = getLocalDateStr();
  const monthStart = `${today.slice(0, 7)}-01`;
  return {
    version: 3,
    profile: {
      nickname: generateRandomNickname(),
      avatarType: 'svg',
      avatarData: generateRandomAvatarSVG(),
      wallpaper: '',
      blurPx: 20,
      theme: 'sage',
      darkMode: false,
      writingGoal: 200
    },
    audio: {
      master: true,
      typing: true,
      flip: true,
      bgm: 'none'
    },
    // 绝对空白初始状态：不预置任何待办、日记、动态、快递、标签、模板、短语、纪念日、流水
    todos: [],
    parcels: [],
    diaries: [],
    posts: [],
    tags: [],
    templates: [],
    phrases: [],
    anniversaries: [],
    focusLogs: [],
    ledgers: [
      { id: 'ledger_default', name: '日常账本', budget: 0 },
      { id: 'ledger_travel', name: '旅行账本', budget: 0 },
      { id: 'ledger_study', name: '学习账本', budget: 0 }
    ],
    activeLedgerId: 'ledger_default',
    transactions: [],
    inputHistory: [],
    snapshots: [],
    trash: [],
    notifiedIds: {},
    ui: {
      sortMode: 'auto',
      urgentOnly: false,
      filterTagId: '',
      postFilterTagId: '',
      calStatStart: monthStart,
      calStatEnd: today,
      ledgerStatStart: monthStart,
      ledgerStatEnd: today
    }
  };
}

// Bug 7 修复：旧版 JSON 导入深度字段兼容补全
function migrateAndSanitizeState(raw) {
  const base = createBlankInitialState();
  if (!raw || typeof raw !== 'object') return base;
  const merged = Object.assign({}, base, raw);
  merged.profile = Object.assign({}, base.profile, raw.profile || {});
  merged.audio = Object.assign({}, base.audio, raw.audio || {});
  merged.ui = Object.assign({}, base.ui, raw.ui || {});

  const arrayKeys = [
    'todos', 'parcels', 'diaries', 'posts', 'tags',
    'templates', 'phrases', 'anniversaries', 'focusLogs',
    'transactions', 'inputHistory', 'snapshots', 'trash'
  ];
  arrayKeys.forEach(k => {
    if (!Array.isArray(merged[k])) merged[k] = [];
  });

  if (!Array.isArray(merged.ledgers) || merged.ledgers.length === 0) {
    merged.ledgers = base.ledgers;
  }
  if (!merged.ledgers.some(l => l.id === merged.activeLedgerId)) {
    merged.activeLedgerId = merged.ledgers[0].id;
  }
  if (!merged.notifiedIds || typeof merged.notifiedIds !== 'object') {
    merged.notifiedIds = {};
  }

  merged.todos.forEach((t, idx) => {
    if (!t.priority) t.priority = 'medium';
    if (!Array.isArray(t.subtasks)) t.subtasks = [];
    if (!Array.isArray(t.skippedDates)) t.skippedDates = [];
    if (typeof t.remindOffsetMin !== 'number') t.remindOffsetMin = 0;
    if (typeof t.sortIndex !== 'number') t.sortIndex = idx;
    if (!t.linkedDiaryId) t.linkedDiaryId = '';
  });

  merged.diaries.forEach(d => {
    if (!d.lockHash) d.lockHash = '';
  });

  return merged;
}

let state = loadStateFromStorage();

function loadStateFromStorage() {
  try {
    const rawStr = localStorage.getItem(STORAGE_KEY);
    if (!rawStr) {
      const fresh = createBlankInitialState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
      return fresh;
    }
    return migrateAndSanitizeState(JSON.parse(rawStr));
  } catch (e) {
    return createBlankInitialState();
  }
}

// Bug 2 修复：捕获 localStorage 存储空间已满异常
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  } catch (err) {
    if (err && (err.name === 'QuotaExceededError' || err.code === 22)) {
      showToast('本地存储空间已满！请清理回收站或删除部分大图片与旧快照');
    } else {
      showToast('保存失败：' + (err.message || '未知存储异常'));
    }
    return false;
  }
}

/* ==========================================================================
   模块 3：离线 Web Audio API 声学引擎（Bug 13 修复：防节点泄漏与后台休眠）
   ========================================================================== */
const SoundEngine = {
  ctx: null,
  bgmSource: null,
  bgmGain: null,
  bgmFilter: null,

  ensureContext() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    return this.ctx;
  },

  playTypingSound() {
    if (!state.audio.master || !state.audio.typing) return;
    const ctx = this.ensureContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(520 + Math.random() * 140, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.035);
    gain.gain.setValueAtTime(0.06, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.038);
    osc.onended = () => {
      try { osc.disconnect(); gain.disconnect(); } catch (e) {}
    };
  },

  playPageFlipSound() {
    if (!state.audio.master || !state.audio.flip) return;
    const ctx = this.ensureContext();
    if (!ctx) return;
    const duration = 0.22;
    const bufferSize = Math.floor(ctx.sampleRate * duration);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      const env = Math.sin((i / bufferSize) * Math.PI);
      data[i] = (Math.random() * 2 - 1) * env * 0.35;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(900, ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(2200, ctx.currentTime + duration);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.005, ctx.currentTime + duration);

    src.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    src.start();
    src.onended = () => {
      try { src.disconnect(); filter.disconnect(); gain.disconnect(); } catch (e) {}
    };
  },

  stopBgm() {
    if (this.bgmSource) {
      try { this.bgmSource.stop(); } catch (e) {}
      try { this.bgmSource.disconnect(); } catch (e) {}
      this.bgmSource = null;
    }
    if (this.bgmFilter) {
      try { this.bgmFilter.disconnect(); } catch (e) {}
      this.bgmFilter = null;
    }
    if (this.bgmGain) {
      try { this.bgmGain.disconnect(); } catch (e) {}
      this.bgmGain = null;
    }
  },

  startBgm(type) {
    this.stopBgm();
    if (!state.audio.master || type === 'none') return;
    const ctx = this.ensureContext();
    if (!ctx) return;

    const seconds = 4;
    const length = ctx.sampleRate * seconds;
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const output = buffer.getChannelData(0);

    let lastOut = 0;
    for (let i = 0; i < length; i++) {
      const white = Math.random() * 2 - 1;
      if (type === 'rain') {
        output[i] = white * 0.25;
      } else if (type === 'wind') {
        lastOut = (lastOut + 0.02 * white) / 1.02;
        output[i] = lastOut * 2.4;
      } else {
        lastOut = (lastOut + 0.05 * white) / 1.05;
        output[i] = (lastOut * 1.4 + white * 0.06) * (0.85 + 0.15 * Math.sin(i / 8000));
      }
    }

    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = type === 'rain' ? 1400 : (type === 'wind' ? 480 : 850);

    const gain = ctx.createGain();
    gain.gain.value = 0.09;

    src.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    src.start();

    this.bgmSource = src;
    this.bgmFilter = filter;
    this.bgmGain = gain;
  }
};

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    SoundEngine.stopBgm();
  } else if (state.audio.master && state.audio.bgm !== 'none') {
    SoundEngine.startBgm(state.audio.bgm);
  }
});

document.addEventListener('keydown', (e) => {
  if ((e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') && e.key.length === 1) {
    SoundEngine.playTypingSound();
  }
});

/* ==========================================================================
   模块 4：【最高优先级修复 Bug 1, 3, 21】7 页立体翻书引擎与底部导航事件绑定
   ========================================================================== */
let currentPageIdx = 0;

function renderPageByIndex(idx) {
  if (idx === 0) renderDashboard();
  else if (idx === 1) renderParcelPage();
  else if (idx === 2) renderCalendarPage();
  else if (idx === 3) renderDiaryPage();
  else if (idx === 4) renderMomentsPage();
  else if (idx === 5) renderTimelinePage();
  else if (idx === 6) renderSettingsPage();
}

function syncBottomNavActive(idx) {
  const navButtons = document.querySelectorAll('#bottom-nav-bar .nav-item');
  navButtons.forEach(btn => {
    const p = Number(btn.getAttribute('data-page'));
    if (p === idx) btn.classList.add('active');
    else btn.classList.remove('active');
  });
}

function goToPage(targetIdx) {
  const idx = Number(targetIdx);
  if (isNaN(idx) || idx < 0 || idx > 6) return;

  // 即使点击当前页也强制刷新数据并校准选中状态，防止空白
  syncBottomNavActive(idx);
  document.getElementById('header-subtitle').textContent = `第 ${idx + 1} / 7 页 · ${PAGE_NAMES[idx]}`;

  if (idx === currentPageIdx) {
    renderPageByIndex(idx);
    return;
  }

  const oldPage = document.getElementById(`page-${currentPageIdx}`);
  const newPage = document.getElementById(`page-${idx}`);
  if (!oldPage || !newPage) return;

  const goingForward = idx > currentPageIdx;

  // 清理所有残留过渡类，防止快速连点导致多页叠加或锁死
  document.querySelectorAll('.book-page').forEach(p => {
    p.classList.remove('active', 'flip-out-left', 'flip-out-right');
  });

  oldPage.classList.add(goingForward ? 'flip-out-left' : 'flip-out-right');
  setTimeout(() => {
    oldPage.classList.remove('flip-out-left', 'flip-out-right');
  }, 420);

  newPage.classList.add('active');
  newPage.scrollTop = 0;
  currentPageIdx = idx;

  SoundEngine.playPageFlipSound();
  renderPageByIndex(idx);
}

function turnPage(delta) {
  const next = currentPageIdx + delta;
  if (next >= 0 && next <= 6) {
    goToPage(next);
  }
}

// 统一委托绑定底部 7 栏导航点击与触摸事件，彻底消除点击无响应、冒泡阻止或 SVG 遮挡问题
(function initBottomNavEvents() {
  const navBar = document.getElementById('bottom-nav-bar');
  if (!navBar) return;

  navBar.addEventListener('click', (e) => {
    const btn = e.target.closest('.nav-item');
    if (!btn) return;
    e.stopPropagation();
    const pageIndex = Number(btn.getAttribute('data-page'));
    goToPage(pageIndex);
  });
})();

// 触摸手势滑动翻页（严格限制在 #book-viewport 内，不干扰底部导航，passive: true 保障滚动流畅）
(function initBookTouchSwipe() {
  const viewport = document.getElementById('book-viewport');
  let startX = 0;
  let startY = 0;
  let ignoreSwipe = false;

  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || window.__isDraggingTodo) {
      ignoreSwipe = true;
      return;
    }
    const target = e.target;
    const tag = target.tagName;
    if (
      ['INPUT', 'TEXTAREA', 'SELECT', 'CANVAS', 'BUTTON'].includes(tag) ||
      target.closest('.drag-handle') ||
      target.closest('#bottom-nav-bar') ||
      target.closest('.modal-backdrop')
    ) {
      ignoreSwipe = true;
      return;
    }
    ignoreSwipe = false;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  viewport.addEventListener('touchend', (e) => {
    if (ignoreSwipe || window.__isDraggingTodo || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 72 && Math.abs(dx) > Math.abs(dy) * 1.65) {
      if (dx < 0 && currentPageIdx < 6) turnPage(1);
      if (dx > 0 && currentPageIdx > 0) turnPage(-1);
    }
  }, { passive: true });
})();

function extractTimeFromText(text) {
  const match = text.match(/(\d{1,2})[:：点](\d{1,2})?/);
  if (!match) return '';
  const hh = String(Math.min(23, Number(match[1]))).padStart(2, '0');
  const mm = match[2] ? String(Math.min(59, Number(match[2]))).padStart(2, '0') : '00';
  return `${hh}:${mm}`;
}

function detectEmotionFromText(text) {
  if (/开心|快乐|棒|喜欢|满足|期待|顺利|幸福|兴奋|惊喜/.test(text)) return '开心愉悦';
  if (/累|疲惫|困|加班|崩溃|烦|焦虑|压力/.test(text)) return '疲惫承压';
  if (/难过|低落|委屈|遗憾|孤单|失落/.test(text)) return '低落敏感';
  if (/平静|散步|看书|喝茶|阳光|发呆|安静/.test(text)) return '平和松弛';
  return '日常随记';
}

function parseParcelMessage(raw) {
  const codeMatch = raw.match(/(?:取件码|提取码|凭|码)[：:\s]*([A-Za-z0-9-]{4,14})/) || raw.match(/\b(\d{1,2}-\d{1,2}-\d{3,5}|\d{6,8})\b/);
  const stationMatch = raw.match(/(菜鸟驿站|丰巢快递柜|丰巢|妈妈驿站|兔喜生活|快递柜|门卫室|驿站[^\s，。,！!]*)/);
  const deadlineMatch = raw.match(/(今日|明天|后天|\d{1,2}月\d{1,2}日|\d{1,2}:\d{2})前?/);
  if (!codeMatch && !/快递|包裹|取件|驿站|丰巢/.test(raw)) return null;
  return {
    id: 'prc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    code: codeMatch ? codeMatch[1] : '待核对单号',
    station: stationMatch ? stationMatch[1] : '默认驿站',
    deadline: deadlineMatch ? deadlineMatch[0] : '尽快领取',
    rawText: raw.trim(),
    picked: false,
    createdAt: Date.now(),
    date: getLocalDateStr()
  };
}

function handleOmniSubmit() {
  const inp = document.getElementById('omni-input');
  const raw = inp.value.trim();
  if (!raw) return;
  document.getElementById('omni-history-dropdown').classList.remove('open');
  recordInputHistory(raw);

  // 1. 全站检索指令 (?关键词)
  if (raw.startsWith('?') || raw.startsWith('？')) {
    const kw = raw.slice(1).trim();
    if (kw) executeGlobalSearch(kw);
    return;
  }

  // 2. 快递取件识别
  if (/取件码|菜鸟|丰巢|快递|驿站/.test(raw)) {
    const parcel = parseParcelMessage(raw);
    if (parcel) {
      state.parcels.unshift(parcel);
      saveState();
      inp.value = '';
      renderDashboard();
      showToast(`已识别快递取件码：${parcel.code}`);
      return;
    }
  }

  // 3. 记账识别
  const moneyMatch = raw.match(/([+-]?\d+(?:\.\d{1,2})?)\s*(?:元|块|rmb|RMB)/);
  if (moneyMatch && !/\d{1,2}:\d{2}/.test(raw)) {
    const amount = Math.abs(parseFloat(moneyMatch[1]));
    const isIncome = /收入|工资|奖金|报销|收款/.test(raw);
    const title = raw.replace(moneyMatch[0], '').trim() || (isIncome ? '快速收入' : '快速支出');
    state.transactions.unshift({
      id: 'tx_' + Date.now(),
      ledgerId: state.activeLedgerId,
      type: isIncome ? 'income' : 'expense',
      amount,
      title,
      category: '餐饮饮食',
      date: getLocalDateStr(),
      createdAt: Date.now()
    });
    saveState();
    inp.value = '';
    renderDashboard();
    showToast(`已记入当前账本：${title} ${amount} 元`);
    return;
  }

  // 4. 心情日记识别
  if (/^(?:日记|心情)[：:\s]/.test(raw)) {
    const body = raw.replace(/^(?:日记|心情)[：:\s]/, '').trim();
    const today = getLocalDateStr();
    state.diaries.unshift({
      id: 'dia_' + Date.now(),
      title: `${today} 随手记`,
      content: body,
      emotion: detectEmotionFromText(body),
      weather: '晴朗',
      date: today,
      createdAt: Date.now(),
      capsuleDate: '',
      lockHash: '',
      tagId: '',
      media: '',
      attachment: null
    });
    saveState();
    inp.value = '';
    renderDashboard();
    showToast('已保存为今日心情日记');
    return;
  }

  // 5. 多条待办自动拆分与时间冲突检测
  const parts = raw.split(/[；;，,。\n]|然后|并且|接着/).map(s => s.trim()).filter(Boolean);
  const today = getLocalDateStr();
  const createdList = [];
  const conflicts = [];

  parts.forEach((part, idx) => {
    const timeStr = extractTimeFromText(part);
    const prio = /紧急|立刻|马上|重要/.test(part) ? 'urgent' : (/高优|优先/.test(part) ? 'high' : 'medium');
    if (timeStr) {
      const hit = state.todos.find(t => !t.deleted && t.date === today && t.time === timeStr);
      if (hit) conflicts.push(`${timeStr} 与已有「${hit.title}」时间冲突`);
    }
    createdList.push({
      id: 'td_' + Date.now() + '_' + idx,
      title: part,
      date: today,
      time: timeStr,
      remindOffsetMin: timeStr ? 10 : 0,
      priority: prio,
      repeat: 'none',
      repeatUntil: '',
      skippedDates: [],
      tagId: '',
      done: false,
      subtasks: [],
      linkedDiaryId: '',
      attachment: null,
      sortIndex: -1 - idx,
      createdAt: Date.now()
    });
  });

  state.todos = [...createdList, ...state.todos];
  normalizeTodoSortIndices();
  saveState();
  inp.value = '';
  renderDashboard();

  if (conflicts.length > 0) {
    openConflictAlertModal(conflicts, createdList.length);
  } else {
    showToast(`已智能解析并创建 ${createdList.length} 条待办`);
  }
}

function executeBulkScheduleImport() {
  const raw = document.getElementById('bulk-schedule-text').value;
  const targetDate = document.getElementById('bulk-schedule-date').value || getLocalDateStr();
  const offsetMin = Number(document.getElementById('bulk-schedule-offset').value || 0);
  const lines = raw.split(/\r?\n/).map(l => l.replace(/^[-*•\d.、\s]+/, '').trim()).filter(Boolean);

  if (lines.length === 0) {
    showToast('请先粘贴有效的日程文本行');
    return;
  }

  const conflicts = [];
  const batch = lines.map((line, i) => {
    const timeStr = extractTimeFromText(line);
    const prio = /紧急|重要|截止/.test(line) ? 'urgent' : (/高优|优先/.test(line) ? 'high' : 'medium');
    if (timeStr) {
      const clash = state.todos.find(t => t.date === targetDate && t.time === timeStr);
      if (clash) conflicts.push(`${targetDate} ${timeStr}：${line} 与「${clash.title}」撞期`);
    }
    return {
      id: 'td_bulk_' + Date.now() + '_' + i,
      title: line,
      date: targetDate,
      time: timeStr,
      remindOffsetMin: timeStr ? offsetMin : 0,
      priority: prio,
      repeat: 'none',
      repeatUntil: '',
      skippedDates: [],
      tagId: '',
      done: false,
      subtasks: [],
      linkedDiaryId: '',
      attachment: null,
      sortIndex: -1 - i,
      createdAt: Date.now()
    };
  });

  state.todos = [...batch, ...state.todos];
  normalizeTodoSortIndices();
  saveState();
  closeModal();
  renderDashboard();

  if (conflicts.length > 0) {
    openConflictAlertModal(conflicts, batch.length);
  } else {
    showToast(`批量导入成功，共生成 ${batch.length} 条待办`);
  }
}

/* ==========================================================================
   模块 7：待办管理（循环规则、跳过/延后、子任务同步、关联日记、批量与拖拽排序）
   ========================================================================== */
let selectedBatchTodoIds = new Set();
let isBatchMode = false;

function normalizeTodoSortIndices() {
  state.todos.forEach((t, idx) => {
    t.sortIndex = idx;
  });
}

function isTodoVisibleOnDate(todo, dateStr) {
  if (todo.skippedDates && todo.skippedDates.includes(dateStr)) return false;
  if (todo.date === dateStr) return true;
  if (!todo.repeat || todo.repeat === 'none') return false;
  if (dateStr < todo.date) return false;
  if (todo.repeatUntil && dateStr > todo.repeatUntil) return false;

  const [y1, m1, d1] = todo.date.split('-').map(Number);
  const [y2, m2, d2] = dateStr.split('-').map(Number);
  const dt1 = new Date(y1, m1 - 1, d1);
  const dt2 = new Date(y2, m2 - 1, d2);
  const diffDays = Math.round((dt2 - dt1) / 86400000);

  if (todo.repeat === 'daily') return true;
  if (todo.repeat === 'weekly') return diffDays % 7 === 0;
  if (todo.repeat === 'monthly') return d1 === d2;
  return false;
}

// Bug 4 修复：循环任务单次跳过或延后 1 天，绝不篡改原始循环规律
function skipRecurringOccurrence(todoId) {
  const todo = state.todos.find(t => t.id === todoId);
  if (!todo) return;
  const today = getLocalDateStr();
  if (!Array.isArray(todo.skippedDates)) todo.skippedDates = [];
  if (!todo.skippedDates.includes(today)) todo.skippedDates.push(today);
  saveState();
  renderDashboard();
  showToast('已跳过今日循环实例，原循环周期保持不变');
}

function deferTodoOneDay(todoId) {
  const todo = state.todos.find(t => t.id === todoId);
  if (!todo) return;
  const today = getLocalDateStr();
  const tomorrow = addDaysToLocalDate(today, 1);

  if (todo.repeat && todo.repeat !== 'none') {
    if (!Array.isArray(todo.skippedDates)) todo.skippedDates = [];
    if (!todo.skippedDates.includes(today)) todo.skippedDates.push(today);
    state.todos.unshift({
      ...JSON.parse(JSON.stringify(todo)),
      id: 'td_defer_' + Date.now(),
      date: tomorrow,
      repeat: 'none',
      repeatUntil: '',
      skippedDates: [],
      done: false
    });
  } else {
    todo.date = tomorrow;
  }
  saveState();
  renderDashboard();
  showToast(`已顺延至明日 (${tomorrow})`);
}

// Bug 4 修复：勾选子任务自动同步主任务完成状态
function toggleSubtaskDone(todoId, subIdx) {
  const todo = state.todos.find(t => t.id === todoId);
  if (!todo || !todo.subtasks[subIdx]) return;
  todo.subtasks[subIdx].done = !todo.subtasks[subIdx].done;
  if (todo.subtasks.length > 0) {
    todo.done = todo.subtasks.every(s => s.done);
  }
  saveState();
  renderDashboard();
}

function toggleTodoDone(todoId) {
  const todo = state.todos.find(t => t.id === todoId);
  if (!todo) return;
  todo.done = !todo.done;
  if (todo.subtasks && todo.subtasks.length > 0) {
    todo.subtasks.forEach(s => { s.done = todo.done; });
  }
  saveState();
  renderDashboard();
}

function deleteTodoToTrash(todoId) {
  const idx = state.todos.findIndex(t => t.id === todoId);
  if (idx === -1) return;
  const [removed] = state.todos.splice(idx, 1);
  state.trash.unshift({
    id: 'tr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
    type: 'todo',
    label: removed.title,
    payload: removed,
    deletedAt: Date.now()
  });
  saveState();
  renderDashboard();
  showToast('已移入回收站（保留 7 天）');
}

let pendingTodoAttachment = null;

// Bug 2 & Bug 22 修复：文件体积校验与 FileReader 异常捕获
function triggerTodoAttachment() {
  const inp = document.getElementById('hidden-file-input');
  inp.value = '';
  inp.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > MAX_FILE_BYTES) {
      showToast('附件体积超过 800KB 限制，请压缩后重试');
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => showToast('读取附件失败，请重试');
    reader.onload = () => {
      pendingTodoAttachment = { name: file.name, type: file.type, dataUrl: reader.result };
      showToast(`已挂载附件：${file.name}`);
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function saveTodoFromModal(existingId) {
  const title = document.getElementById('td-form-title').value.trim();
  if (!title) { showToast('请输入任务标题'); return; }
  const date = document.getElementById('td-form-date').value || getLocalDateStr();
  const time = document.getElementById('td-form-time').value;
  const remindOffsetMin = Number(document.getElementById('td-form-offset').value || 0);
  const priority = document.getElementById('td-form-prio').value;
  const repeat = document.getElementById('td-form-repeat').value;
  const repeatUntil = document.getElementById('td-form-until').value;
  const tagId = document.getElementById('td-form-tag').value;
  const linkedDiaryId = document.getElementById('td-form-diary').value;
  const subLines = document.getElementById('td-form-subtasks').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);

  if (existingId) {
    const target = state.todos.find(t => t.id === existingId);
    if (target) {
      const oldMap = new Map((target.subtasks || []).map(s => [s.title, s.done]));
      target.title = title;
      target.date = date;
      target.time = time;
      target.remindOffsetMin = remindOffsetMin;
      target.priority = priority;
      target.repeat = repeat;
      target.repeatUntil = repeatUntil;
      target.tagId = tagId;
      target.linkedDiaryId = linkedDiaryId;
      target.subtasks = subLines.map(st => ({ title: st, done: oldMap.get(st) || false }));
      if (target.subtasks.length > 0) {
        target.done = target.subtasks.every(s => s.done);
      }
      if (pendingTodoAttachment) target.attachment = pendingTodoAttachment;
    }
  } else {
    state.todos.unshift({
      id: 'td_' + Date.now(),
      title,
      date,
      time,
      remindOffsetMin,
      priority,
      repeat,
      repeatUntil,
      skippedDates: [],
      tagId,
      linkedDiaryId,
      done: false,
      subtasks: subLines.map(st => ({ title: st, done: false })),
      attachment: pendingTodoAttachment,
      sortIndex: -1,
      createdAt: Date.now()
    });
    normalizeTodoSortIndices();
  }
  pendingTodoAttachment = null;
  saveState();
  closeModal();
  renderDashboard();
  showToast('待办已保存');
}

function jumpToLinkedDiary(diaryId) {
  const diary = state.diaries.find(d => d.id === diaryId);
  if (!diary) {
    showToast('关联的日记不存在或已被删除');
    return;
  }
  goToPage(3);
  setTimeout(() => {
    const card = document.getElementById(`diary-card-${diaryId}`);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.style.boxShadow = '0 0 0 2px var(--accent)';
      setTimeout(() => { card.style.boxShadow = ''; }, 1800);
    }
  }, 150);
}

/* ==========================================================================
   模块 8：批量操作面板与快捷日程拖拽排序（Bug 18 修复状态残留与触摸冲突）

// Bug 18 修复：确保每次拖拽结束或取消时必定清理 dragging / drag-over 与全局标记
function resetDragVisualStates(cards) {
  window.__isDraggingTodo = false;
  cards.forEach(c => c.classList.remove('dragging', 'drag-over'));
}

function bindTodoDragEvents(container) {
  window.__isDraggingTodo = false;
  if (state.ui.sortMode !== 'manual') return;
  const cards = Array.from(container.querySelectorAll('.todo-card[data-id]'));
  let draggedId = null;

  cards.forEach(card => {
    card.setAttribute('draggable', 'true');

    card.addEventListener('dragstart', () => {
      draggedId = card.dataset.id;
      window.__isDraggingTodo = true;
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => {
      draggedId = null;
      resetDragVisualStates(cards);
    });
    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (card.dataset.id !== draggedId) card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      const targetId = card.dataset.id;
      const fromId = draggedId;
      draggedId = null;
      resetDragVisualStates(cards);
      if (fromId && fromId !== targetId) {
        reorderTodos(fromId, targetId);
      }
    });

    const handle = card.querySelector('.drag-handle');
    if (handle) {
      let touchActive = false;
      handle.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        touchActive = true;
        draggedId = card.dataset.id;
        window.__isDraggingTodo = true;
        card.classList.add('dragging');
      }, { passive: true });

      handle.addEventListener('touchmove', (e) => {
        if (!touchActive) return;
        e.preventDefault();
        const touch = e.touches[0];
        const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
        const overCard = targetEl ? targetEl.closest('.todo-card[data-id]') : null;
        cards.forEach(c => c.classList.remove('drag-over'));
        if (overCard && overCard.dataset.id !== draggedId) {
          overCard.classList.add('drag-over');
        }
      }, { passive: false });

      const finishTouchDrag = (e) => {
        if (!touchActive) return;
        touchActive = false;
        const fromId = draggedId;
        draggedId = null;
        resetDragVisualStates(cards);
        const touch = e.changedTouches && e.changedTouches[0];
        if (!touch) return;
        const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
        const overCard = targetEl ? targetEl.closest('.todo-card[data-id]') : null;
        if (overCard && overCard.dataset.id !== fromId) {
          reorderTodos(fromId, overCard.dataset.id);
        }
      };

      handle.addEventListener('touchend', finishTouchDrag, { passive: true });
      handle.addEventListener('touchcancel', finishTouchDrag, { passive: true });
    }
  });
}

function reorderTodos(fromId, toId) {
  const fromIdx = state.todos.findIndex(t => t.id === fromId);
  const toIdx = state.todos.findIndex(t => t.id === toId);
  if (fromIdx === -1 || toIdx === -1) return;
  const [moved] = state.todos.splice(fromIdx, 1);
  state.todos.splice(toIdx, 0, moved);
  normalizeTodoSortIndices();
  saveState();
  renderDashboard();
}

/* ==========================================================================
   模块 9：今日仪表盘渲染与全站高亮检索
   ========================================================================== */
function calculateStreakDays() {
  const activeDates = new Set();
  state.todos.forEach(t => { if (t.done) activeDates.add(t.date); });
  state.diaries.forEach(d => activeDates.add(d.date));
  state.focusLogs.forEach(f => activeDates.add(f.date));

  let streak = 0;
  let cursor = getLocalDateStr();
  while (activeDates.has(cursor)) {
    streak++;
    cursor = addDaysToLocalDate(cursor, -1);
  }
  return streak;
}

function renderDashboard() {
  const today = getLocalDateStr();
  const todayTodosAll = state.todos.filter(t => isTodoVisibleOnDate(t, today));
  const doneCount = todayTodosAll.filter(t => t.done).length;
  const pendingParcels = state.parcels.filter(p => !p.picked);
  const todayDiaryWords = state.diaries
    .filter(d => d.date === today)
    .reduce((sum, d) => sum + (d.content ? d.content.length : 0), 0);

  document.getElementById('dashboard-kpi').innerHTML = `
    <div class="kpi-tile"><div class="kpi-val">${doneCount} / ${todayTodosAll.length}</div><div class="kpi-lbl">今日待办完成</div></div>
    <div class="kpi-tile"><div class="kpi-val">${calculateStreakDays()} 天</div><div class="kpi-lbl">连续打卡天数</div></div>
    <div class="kpi-tile"><div class="kpi-val">${pendingParcels.length} 件</div><div class="kpi-lbl">待取快递包裹</div></div>
    <div class="kpi-tile"><div class="kpi-val">${todayDiaryWords} 字</div><div class="kpi-lbl">今日写作字数</div></div>
  `;

  const annContainer = document.getElementById('anniversary-list');
  if (state.anniversaries.length === 0) {
    annContainer.innerHTML = `<span class="text-xs">暂无纪念日倒数，点击右上角添加重要日子</span>`;
  } else {
    annContainer.innerHTML = state.anniversaries.map((ann, idx) => {
      const [y, m, d] = ann.date.split('-').map(Number);
      const [ty, tm, td] = today.split('-').map(Number);
      const diff = Math.round((new Date(y, m - 1, d) - new Date(ty, tm - 1, td)) / 86400000);
      const label = diff === 0 ? '就是今天' : (diff > 0 ? `还有 ${diff} 天` : `已过 ${Math.abs(diff)} 天`);
      return `<span class="badge" style="padding:5px 10px;">
        <strong>${escapeHTML(ann.title)}</strong> · ${label} (${ann.date})
        <span style="cursor:pointer;margin-left:4px;color:var(--danger);" onclick="deleteAnniversary(${idx})">移除</span>
      </span>`;
    }).join('');
  }

  const dParcel = document.getElementById('dashboard-parcel-list');
  if (pendingParcels.length === 0) {
    dParcel.innerHTML = `<div class="text-xs">当前没有待取快递</div>`;
  } else {
    dParcel.innerHTML = pendingParcels.slice(0, 3).map(p => `
      <div class="flex-row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);">
        <div>
          <strong style="color:var(--accent-text);">${escapeHTML(p.code)}</strong>
          <span class="text-xs"> · ${escapeHTML(p.station)} · 截止 ${escapeHTML(p.deadline)}</span>
        </div>
        <button type="button" class="btn btn-primary btn-sm" onclick="markParcelPicked('${p.id}')">一键已取</button>
      </div>
    `).join('');
  }

  document.getElementById('btn-sort-mode').textContent = state.ui.sortMode === 'manual' ? '排序: 手动拖拽' : '排序: 自动优先级';
  document.getElementById('btn-urgent-filter').classList.toggle('active', state.ui.urgentOnly);

  const tagBar = document.getElementById('todo-tag-filter-bar');
  tagBar.innerHTML = `
    <button type="button" class="chip ${state.ui.filterTagId === '' ? 'active' : ''}" onclick="setTodoTagFilter('')">全部标签</button>
    ${state.tags.map(tg => `
      <button type="button" class="chip ${state.ui.filterTagId === tg.id ? 'active' : ''}" onclick="setTodoTagFilter('${tg.id}')">${escapeHTML(tg.name)}</button>
    `).join('')}
  `;

  let list = [...todayTodosAll];
  if (state.ui.urgentOnly) list = list.filter(t => t.priority === 'urgent');
  if (state.ui.filterTagId) list = list.filter(t => t.tagId === state.ui.filterTagId);

  const prioWeight = { urgent: 0, high: 1, medium: 2, low: 3 };
  if (state.ui.sortMode === 'auto') {
    list.sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return (prioWeight[a.priority] ?? 2) - (prioWeight[b.priority] ?? 2);
    });
  } else {
    list.sort((a, b) => (a.sortIndex ?? 0) - (b.sortIndex ?? 0));
  }

  const todoListEl = document.getElementById('today-todo-list');
  if (list.length === 0) {
    todoListEl.innerHTML = `<div class="empty-placeholder">今日暂无匹配待办，可在顶部智能输入框录入或点击「新建待办」</div>`;
    return;
  }

  const prioNames = { urgent: '紧急', high: '高', medium: '中', low: '低' };
  const repeatNames = { daily: '每日循环', weekly: '每周循环', monthly: '每月循环' };

  todoListEl.innerHTML = list.map(t => {
    const tag = state.tags.find(tg => tg.id === t.tagId);
    const linkedDiary = t.linkedDiaryId ? state.diaries.find(d => d.id === t.linkedDiaryId) : null;
    const subs = t.subtasks || [];
    const subDone = subs.filter(s => s.done).length;
    const pct = subs.length > 0 ? Math.round((subDone / subs.length) * 100) : (t.done ? 100 : 0);

    return `
      <div class="todo-card prio-${t.priority} ${t.done ? 'done' : ''}" data-id="${t.id}">
        <div class="todo-main-row">
          ${isBatchMode ? `<input type="checkbox" ${selectedBatchTodoIds.has(t.id) ? 'checked' : ''} onchange="toggleBatchSelectTodo('${t.id}')" style="margin-top:4px;" />` : ''}
          <div class="check-circle ${t.done ? 'checked' : ''}" onclick="toggleTodoDone('${t.id}')">
            ${t.done ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
          </div>
          <div style="flex:1;min-width:0;">
            <div class="flex-row" style="justify-content:space-between;">
              <span class="todo-title" style="font-weight:600;word-break:break-word;">${escapeHTML(t.title)}</span>
              ${state.ui.sortMode === 'manual' ? `<span class="badge drag-handle" style="cursor:grab;touch-action:none;">拖动排序</span>` : ''}
            </div>
            <div class="flex-row mt-8" style="gap:5px;">
              <span class="badge">${prioNames[t.priority] || '中'}</span>
              ${t.time ? `<span class="badge">${escapeHTML(t.time)}${t.remindOffsetMin > 0 ? ` (提前${t.remindOffsetMin}分)` : ''}</span>` : ''}
              ${t.repeat && t.repeat !== 'none' ? `<span class="badge">${repeatNames[t.repeat]}</span>` : ''}
              ${tag ? `<span class="badge" style="border-color:${tag.color};color:${tag.color};">${escapeHTML(tag.name)}</span>` : ''}
              ${linkedDiary ? `<span class="chip" onclick="jumpToLinkedDiary('${linkedDiary.id}')">关联日记: ${escapeHTML(linkedDiary.title)}</span>` : ''}
              ${t.attachment ? `<span class="chip" onclick="previewAttachment('${t.id}', 'todo')">附件: ${escapeHTML(t.attachment.name)}</span>` : ''}
            </div>
            ${subs.length > 0 ? `
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
              <div class="subtask-list">
                ${subs.map((s, si) => `
                  <label class="flex-row text-xs" style="cursor:pointer;">
                    <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSubtaskDone('${t.id}', ${si})" />
                    <span style="${s.done ? 'text-decoration:line-through;opacity:0.6;' : ''}">${escapeHTML(s.title)}</span>
                  </label>
                `).join('')}
              </div>
            ` : ''}
            <div class="flex-row mt-8" style="justify-content:flex-end;gap:4px;">
              <button type="button" class="btn btn-sm" onclick="startFocusForTodo('${t.id}')">专注</button>
              <button type="button" class="btn btn-sm" data-cat="待办清单" data-body="${escapeHTML(t.title)}" data-meta="${escapeHTML(t.date + ' ' + (t.time || ''))}" onclick="openShareCardFromBtn(this)">分享卡</button>

/* ==========================================================================
   模块 10：全局文本检索（关键词高亮）
   ========================================================================== */
function executeGlobalSearch(keyword) {
  const panel = document.getElementById('search-result-panel');
  const listEl = document.getElementById('search-result-list');
  const kwLower = keyword.toLowerCase();
  const hl = (str) => {
    const safe = escapeHTML(str);
    const re = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return safe.replace(re, '<mark class="highlight-mark">\$1</mark>');
  };

  const hits = [];
  state.todos.forEach(t => {
    if (t.title.toLowerCase().includes(kwLower)) hits.push(`[待办 · ${t.date}] ${hl(t.title)}`);
  });
  state.diaries.forEach(d => {
    if (!d.lockHash && (d.title.toLowerCase().includes(kwLower) || d.content.toLowerCase().includes(kwLower))) {
      hits.push(`[日记 · ${d.date}] ${hl(d.title)}：${hl(d.content.slice(0, 60))}`);
    }
  });
  state.posts.forEach(p => {
    if (p.content.toLowerCase().includes(kwLower)) hits.push(`[动态 · ${p.date}] ${hl(p.content.slice(0, 60))}`);
  });
  state.parcels.forEach(p => {
    if (p.code.toLowerCase().includes(kwLower) || p.station.toLowerCase().includes(kwLower)) {
      hits.push(`[快递] 取件码 ${hl(p.code)} (${hl(p.station)})`);
    }
  });

  panel.style.display = 'block';
  listEl.innerHTML = hits.length === 0
    ? `<div class="text-xs">未找到包含「${escapeHTML(keyword)}」的记录</div>`
    : hits.map(h => `<div style="padding:6px 0;border-bottom:1px solid var(--border-color);font-size:12px;">${h}</div>`).join('');
}

function clearGlobalSearch() {
  document.getElementById('search-result-panel').style.display = 'none';
}

/* ==========================================================================
   模块 11：快递取件页面逻辑
   ========================================================================== */
function parseAndAddParcel() {
  const box = document.getElementById('parcel-raw-input');
  const raw = box.value.trim();
  if (!raw) { showToast('请先输入或粘贴快递短信'); return; }
  const parcel = parseParcelMessage(raw) || {
    id: 'prc_' + Date.now(),
    code: raw.slice(0, 16),
    station: '自提点',
    deadline: '今日内',
    rawText: raw,
    picked: false,
    createdAt: Date.now(),
    date: getLocalDateStr()
  };
  state.parcels.unshift(parcel);
  saveState();
  box.value = '';
  renderParcelPage();
  showToast(`已生成取件卡片：${parcel.code}`);
}

function markParcelPicked(id) {
  const p = state.parcels.find(item => item.id === id);
  if (!p) return;
  p.picked = true;
  p.pickedAt = Date.now();
  saveState();
  renderParcelPage();
  renderDashboard();
  showToast('已标记为取件完成');
}

function deleteParcelToTrash(id) {
  const idx = state.parcels.findIndex(p => p.id === id);
  if (idx === -1) return;
  const [rem] = state.parcels.splice(idx, 1);
  state.trash.unshift({
    id: 'tr_' + Date.now(),
    type: 'parcel',
    label: `取件码 ${rem.code}`,
    payload: rem,
    deletedAt: Date.now()
  });
  saveState();
  renderParcelPage();
  showToast('快递记录已移入回收站');
}

function renderParcelPage() {
  const pending = state.parcels.filter(p => !p.picked);
  const picked = state.parcels.filter(p => p.picked);
  document.getElementById('parcel-pending-count').textContent = `${pending.length} 件待取`;

  document.getElementById('parcel-pending-list').innerHTML = pending.length === 0
    ? `<div class="empty-placeholder">暂无待取件包裹</div>`
    : pending.map(p => `
